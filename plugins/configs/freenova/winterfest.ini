; day      1..24, one calendar day each (owner decision §6.3)
; kind     gingerbread | pass | ornament | gift | title
; id       ornament id / present rarity / set id; 0 for gingerbread and pass
; amount   GingerBread or Winter Pass XP for gingerbread/pass; 0 otherwise
;
; A STRICT one-day window (owner decision 2026-11-22, final; the half-value
; catch-up is withdrawn): day n unlocks on its Europe/Paris date, is claimable on
; that day only, and after midnight it is EXPIRED - not discounted, not
; claimable. wf_advent_state() answers honestly: locked / today / expired /
; claimed / unlocked.
;
; The record of what was missed is kept (the claimed-day list plus the date), so
; the panel and the Advent Pass can show the whole village. The Advent Pass
; entitlement (advent_pass_2026) makes every day claimable at once - a late
; joiner buys the calendar at the end of the season - and the claim key is still
; advent#<day>, so nothing can pay twice.
