; map | origin | rarity | respawn
;
; Content pack: configs/freenova/winterfest/presents.ini (GENERATED from the BSP
; entity lumps of every map in mapcycle.txt - do not hand-edit the generated rows
; here; regenerate with tools/winterfest/gen_spots.py --write and re-merge).
;
; map      the map name (no .bsp), or '*' for the generic fallback set
; origin   "x y z" (a real spawn origin from the map's own entity lump), or a
;          spawn reference resolved at spawn time against the map's entities:
;            @spawn<N> the Nth player spawn, whatever class the map uses
;            @t<N>     the Nth info_player_terrorist (falls back to
;                      info_player_deathmatch - de_dust2's T spawn - then @spawn)
;            @ct<N>    the Nth info_player_counterterrorist (falls back to
;                      info_player_start - de_dust2's CT spawn - then @spawn)
;            @start<N> the Nth info_player_start
;            @dm<N>    the Nth info_player_deathmatch
;          `wf_dump_spawns` on the server console prints the current map's spawns
;          as ready-to-paste rows.
; rarity   0..2, or '?' to roll from the [rarity] weights
; respawn  seconds before the spot comes back (10..900)
;
; A map with at least one row of its own uses ONLY its own rows; a map with none
; uses the '*' rows; and if even those are missing the plugin falls back to a
; built-in set of 8 spawn-derived spots. A map never ends up with zero presents
; (owner decision §6.4: 6-10 per map, default 8).
;
; Coordinates are the entity origins as generated: a present glow sits on the
; floor of a real spawn, which is by construction outside geometry and inside a
; play area. A hand-placed spot at a landmark has no such guarantee - walk to it,
; note the coordinates, and check it with a harness boot before shipping it.
