; PASS XP CALIBRATION: the [pass] curve is 23 700 XP over 24 playable days, i.e.
; roughly 1 000 XP a day. A regular round finds about one present, and roughly a
; quarter of presents carry pass XP, so the amounts here are set to land near
; that daily figure together with the advent days and the Phase 2 missions.
; Change these numbers together with [pass] or the pass stops being reachable.
