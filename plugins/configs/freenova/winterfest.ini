[pouch]
; ----------------------------------------------------------------------------
; Content pack: configs/freenova/winterfest/season.ini (merged verbatim).
;
; The snowflake pouch a death leaves behind (owner decision §6.4): a kill reward,
; never a death penalty - nothing is taken from the player who died, and the
; present they were hunting is not dropped.
;
; gingerbread  GingerBread inside (1..1000)
; life    seconds it lies on the ground (5..120)
; enable  0 turns the drop off
;
; A pouch is never dropped for a bot's death (bot kills are not worth currency)
; and never on a suicide; whoever walks within 60 units first takes it, once.
gingerbread = 5
life = 30
enable = 1


; ----------------------------------------------------------------------------
[spins]
; ----------------------------------------------------------------------------
; The Spin Wheel's currency (workstream 13). This module owns the STATE only:
; a per-player counter, one free spin per player per day, and a consume that
; refuses at zero. The prizes and the wheel are workstream 13's - nothing here
; knows a single prize.
;
; free_per_day   spins granted once per calendar day at connect (0 disables)
; enabled        0 stops the daily grant without touching a balance
;
; The daily grant is idempotent through the same ledger as an Advent day: the
; claim key is spin#<YYYYMMDD>, so five logins in one day pay once, tomorrow
; pays again, and `wf_reset` re-opens today.
free_per_day = 1
enabled      = 1


