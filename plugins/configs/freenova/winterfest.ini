[open]
; ----------------------------------------------------------------------------
; What is inside a present. rarity | reward kind | id | min | max | weight
;
; rarity   which present this row belongs to (0..2)
; kind     gingerbread | pass | ornament | gift | title
; id       ornament: an ornament id, or 0 = "any unowned ornament of this
;            present's rarity" (the roll prefers something you do not have)
;          gift: the rarity of the present inside (a present in a present)
;          title: a set id
;          snow/pass: unused
; min,max  the amount rolled for snow and pass (inclusive); ignored otherwise
; weight   relative chance within that rarity (the weights of a rarity need not
;          add to 100; they are normalised by their sum)
;
; A rarity with no rows pays 15 GingerBread (logged at load). A present that would give
; an ornament while every ornament of that rarity is already owned pays GingerBread
; instead, so a present is never a dud.
