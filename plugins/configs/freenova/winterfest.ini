; ============================================================================
; FreeNova Winterfest 2026 - the whole module's data
; File: addons/amxmodx/configs/freenova/winterfest.ini
;
; THIS IS THE ONLY FILE THE PLUGINS OPEN. The files under
; configs/freenova/winterfest/ (season.ini, ornaments.ini, presents.ini,
; advent.ini, pass.ini, ...) are content-pack sections authored by other
; workstreams; their rows are merged into this file under the matching headers,
; because a Phase 1 deploy is one config file and not a directory the plugins
; have to walk. docs/WINTERFEST-DEV.md §4 says which block came from where and
; how to re-merge after a content-pack update.
;
; WHO READS WHAT;   winterfest_core.amxx   [season] [rarity] [visual] [props] [ornament]
;                          [set] [tree] [advent] [pass] [pass_premium]
;                          [entitlement] [open] [spins]
;   winterfest_gifts.amxx  [rarity] [pouch] [presents]
;   winterfest_menu.amxx   nothing (it asks the core through natives)
;   winterfest_pull.amxx   [pull] (the panel's action queue; off unless configured)
;   an unknown section or an unknown key inside [season] is ignored, so the
;   content pack's documentation keys (timezone, present_defaults) are harmless.
;
; A change applies on the next map change, or immediately after
;   wf_reload
; on the server console. Every cap and range is enforced while parsing: a row
; that does not fit is skipped with a log line, never a crash.
;
; THE CURRENCY IS GingerBread (id `gb`; renamed from "snowflakes" on
; 2026-11-22). A reward-kind column accepts `gingerbread` (canonical) and `snow`
; (the old spelling, still parsed so a re-merged content-pack row works).
;
; Next season: change `year`, `start`, `end` and `advent_end`. Every nvault key
; is stamped with `year` (wf_snow_s2026#<auth>), so a new year starts empty
; without deleting this one - and the claim ledger is stamped the same way, so
; no present, advent day or tier can pay twice across seasons.
; ============================================================================


; ----------------------------------------------------------------------------
[season]
; ----------------------------------------------------------------------------
; Keys the core reads:
;   name        shown by /christmas, in chat and in the startup log
;   year        the season stamp of EVERY wf_* vault key and the claim ledger.
;               CHANGE THIS FOR 2027, or next December reuses this ledger.
;   start/end   the date window. Only the calendar date is compared, so the
;               " 00:00" / " 23:59" are for humans (WfDateKey keeps 8 digits).
;   advent_end  the last calendar day on which ANY advent day can still be
;               claimed - including with the Advent Pass (owner decision §6.3).
;               It normally equals `end`: when the season closes, the calendar
;               does too. A season that keeps presents running past Christmas is
;               one edit here (end = 2026-12-31) and one in advent_end.
;   enabled     0 closes the season without touching anything else.
;
; The dates are read against the SERVER clock. The host must run Europe/Paris
; (the `timezone` key below records the intent for whoever provisions it): on a
; UTC box the day boundary moves by an hour or two, which decides whether the
; current day pays full or half value, never whether a reward pays twice.
;
; The owner's decisions behind these values are in docs/WINTERFEST.md §6.
name = Winterfest
year = 2026
start = 2026-12-01 00:00
end = 2026-12-24 23:59
advent_end = 2026-12-24 23:59
timezone = Europe/Paris
enabled = 1


; ----------------------------------------------------------------------------
[rarity]
; ----------------------------------------------------------------------------
; id | name | R G B | weight
;
; id       0, 1, 2 - this id is what [presents], [open] and the reward natives
;          use, so the rows must stay 0..2 (fewer is allowed, more is not).
; name     shown in chat, in the menus and on the panel.
; R G B    the env_sprite colour of a present of this rarity (0..255).
; weight   relative chance when a present spot's rarity column is '?'.
;
; The two stock sprites this module spends its precache budget on:
; sprites/glow01.spr (the present glow and the pouch - 1 new table entry) and
; sprites/laserbeam.spr (the opening burst - already precached by
; freenova_cosmetics, so it is free). docs/PRECACHE-BUDGET.md has the arithmetic.
0 | Common   | 190 220 255 | 62
1 | Uncommon | 120 255 140 | 28
2 | Rare     | 255 215  90 | 10


; ----------------------------------------------------------------------------
[visual]
; ----------------------------------------------------------------------------
; name | kind | asset | colour | scale | fallback
;
; WHAT A WINTERFEST PROP LOOKS LIKE, AS DATA. The owner's asset pack
; (thirdparty/winterfest-assets/README.md) names its models present_classic,
; tree_classic, tree_green, c4_xmas; those names are ids here, and [props] says
; which id each prop uses. Nothing in the plugins hardcodes a sprite.
;
; kind      sprite_glow   a stock sprite - usable today, costs one precache slot
;           model_present a client model - needs a download (Phase 3)
; asset     the file, relative to cstrike/
; colour    "R G B" for a sprite (the glow tint); "-" for a model
; scale     sprite scale, 0.1 .. 4.0; ignored for a model
; fallback  the visual to use when this one is unusable, or "-"
;
; A model visual is UNUSABLE only while wf_allow_models is 0 or while its file
; is not on disk, and the prop then falls
; back down the chain. The shipped [props] rows name the present MODEL; flipping
; any of them back to `sprite_glow_*` is one config edit, and setting
; `wf_allow_models 0` in configs/plugins/wf_gifts.cfg turns every model prop back
; into its sprite without a recompile (the models are precached either way).
;
; The four sprite rows stay precached: every model row above names one of them
; as its fallback, so a player who has not downloaded the .mdl yet still sees a
; present (tinted glow) instead of nothing.
sprite_glow_common    | sprite_glow   | sprites/glow01.spr          | 190 220 255 | 0.50 | -
sprite_glow_uncommon  | sprite_glow   | sprites/glow01.spr          | 120 255 140 | 0.75 | -
sprite_glow_rare      | sprite_glow   | sprites/glow01.spr          | 255 215  90 | 1.00 | -
sprite_pouch          | sprite_glow   | sprites/glow01.spr          | 150 210 255 | 0.35 | -
;
;
; The SHIPPED present (models/winterfest/present.mdl, 41.8 KB, built and proven
; in docs/MODELS.md) is the default look: a model visual is usable as soon as
; the file is on disk AND wf_allow_models is not 0 (it defaults to 1 since the
; 2026-11 playtest). Each row still names its sprite, so a client that has not
; downloaded the model yet - or a server that never shipped it - degrades to the
; stock glow instead of an invisible or ERROR entity.
;
; Phase 3 (staged): the asset-pack models below are not in this tree, so their
; rows resolve down the chain and the core says so once at load.
present_classic       | model_present | models/winterfest/present.mdl | - | 1.00 | sprite_glow_common
present_uncommon_x    | model_present | models/winterfest/present.mdl | - | 1.00 | sprite_glow_uncommon
present_rare_x        | model_present | models/winterfest/present.mdl | - | 1.00 | sprite_glow_rare
tree_classic          | model_present | models/snow_tree.mdl        | - | 1.00 | -
tree_green            | model_present | models/green_tree3.mdl      | - | 1.00 | -
c4_xmas               | model_present | models/c4-christmastree.mdl | - | 1.00 | -


; ----------------------------------------------------------------------------
[props]
; ----------------------------------------------------------------------------
; slot = visual name (a name from [visual])
;
; present_common / present_uncommon / present_rare
;           the world present of each rarity (winterfest_gifts draws it)
; pouch     the snowflake pouch a death leaves behind
; tree      the in-game tree prop (the panel draws the player's own tree;
;           this is the one a future module may place on the map)
; c4        the planted-C4 replacement (winterfest_atmos' business; it asks for
;           this id through wf_visual_id("c4") rather than naming a file)
;
; A slot that names an unusable visual resolves down its fallback chain, and the
; core says so once at load. `tree` and `c4` resolve to nothing (both are models
; with no sprite fallback and neither file is in this tree), which is expected
; and summarised in one line:
;   [WF] 2 of 6 prop slot(s) drawable now; waiting for downloads: tree, c4
; With the shipped present model on disk the three present slots each log the
; decision they took:
;   [WF] prop 'present_common': draws model 'models/winterfest/present.mdl'
; and with the model absent (or wf_allow_models 0) they log the fallback instead:
;   [WF] prop 'present_rare': visual 'present_rare_x' -> 'sprite_glow_rare' ...
present_common   = present_classic
present_uncommon = present_uncommon_x
present_rare     = present_rare_x
pouch            = sprite_pouch
tree             = tree_classic
c4               = c4_xmas


