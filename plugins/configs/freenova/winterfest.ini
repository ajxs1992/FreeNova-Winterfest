; ----------------------------------------------------------------------------
[entitlement]
; ----------------------------------------------------------------------------
; product id | display name | kind
;
; THE CATALOGUE OF THINGS A PLAYER CAN OWN (owner decision §6.5, model in §7).
; Gameplay only ever asks "does this player own product X" - it never asks how
; they got it. The panel sells it, an admin grants it (wf_ent in game, or the
; panel's admin grant), and later a Stripe webhook fulfils a paid order into the
; same record. Keeping the ids here means wf_has_entitlement() cannot be called
; with a typo that silently answers "no" forever, and the game and the panel
; cannot disagree about what is on sale.
;
; kind is for the panel's display grouping; the game does not branch on it.
;
; Adding a product: add a row, then use the id. Nothing else changes - the
; storage is per player and per product ("product@source"), and the claim key
; discipline already makes fulfilment idempotent.
bp_premium_2026  | Battle Pass Premium 2026 | pass_premium
advent_pass_2026 | Advent Pass 2026         | advent


; ----------------------------------------------------------------------------
[pull]
; ----------------------------------------------------------------------------
; THE PANEL'S ACTION QUEUE, POLLED BY winterfest_pull.amxx
;
; The database is authoritative (docs/panel/00-CONTRACT.md): a panel action
; writes the DB, and this plugin asks the panel what that player still has to
; be given, applies it through the core's ONE grant path, and reports back with
;   GET  /api/game/pending?steamid=<player>
;   POST /api/game/ack   {id, state, error}
; both signed with the ingest's secret (docs/panel/01-DATA.md §7). The docs for
; this half are docs/WINTERFEST-PULL.md.
;
; Nothing here runs unless `enabled` is 1 AND `secret` is set AND `url` parses:
; an unconfigured host sends no traffic at all, which is the correct default
; for a server that has no panel.
;
;   enabled   0/1       poll the panel at all
;   url       scheme    http://<numeric ipv4>:<port> - plain HTTP only, this
;                       build has the sockets module and no TLS. No path: the
;                       two routes are fixed. A hostname is refused because
;                       socket_open() would resolve it synchronously, in the
;                       game frame.
;   secret    hex       the panel's SYNC_SECRET - the same secret the ingest
;                       uses (X-FreeNova-Signature, ±300 s window). Never log
;                       it; never commit a real one.
;   interval  5..600    seconds between ONE player's polls; each player's
;                       schedule is jittered x1.0-1.5 so 32 players do not
;                       fire in the same frame
;   timeout   1..30     seconds a single request may take before it is dropped
;
; Values are `key = value`, exactly like [season]. Comments are whole lines
; only (a secret may contain ';'), and there are no inline comments.
;
; A change applies on `wf_pull_config` (or the next map change); `wf_pull_now
; <target|steamid|all>` forces a poll, `wf_pull_status` prints what the plugin
; thinks its configuration and backoff state are.
enabled  = 0
url      = http://127.0.0.1:18101
secret   =
interval = 20
timeout  = 5
