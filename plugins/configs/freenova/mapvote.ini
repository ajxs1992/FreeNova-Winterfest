; FreeNova MapVote - RTV / nominate / votemap settings
; Loaded by freenova_mapvote.amxx on every map start. Change map to apply.
; Only fnmapvote_* keys are read from this file.

; 1 = plugin on, 0 = off (RTV / nominate / votemap all dead)
fnmapvote_enabled 1

; minimum human players before a vote can run
fnmapvote_players 2

; share of humans that must type /rtv before the ballot starts
fnmapvote_rtv_ratio 0.60

; share of cast votes the winning option needs (runoff ballots)
fnmapvote_ratio 0.50

; seconds RTV / votemap stay locked after a failed vote
fnmapvote_cooldown 45

; seconds after map start before RTV unlocks
fnmapvote_grace 60

; maximum simultaneous nominations (max 8)
fnmapvote_maxnoms 4

; offer / count an extend option in the ballot
fnmapvote_allow_extend 1

; admin access flag for /fnvote /fnextend /fnvotecancel /fnvotereset
; a=immunity b=reservation c=kick d=ban e=slay f=map g=cvar h=cfg i=chat j=vote
fnmapvote_adminflag "j"

; seconds between the result and the changelevel
fnmapvote_changedelay 3

; 1 = one runoff ballot between the top two options if the first fails
fnmapvote_runoff 1
