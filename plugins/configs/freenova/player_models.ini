; FreeNova Forced Player Models Configuration
; File: addons/amxmodx/configs/freenova/player_models.ini
;
; Format:
;   "<SteamID | PlayerName>" "<ModelName>" [Team: 0=All, 1=Terrorist, 2=CT]
;
; Rules:
;   - SteamID matching takes priority over PlayerName matching.
;   - ModelName is the model folder in models/player/<ModelName>/<ModelName>.mdl
;   - Forced assignments override VIP, Admin, Level, and BattlePass models unconditionally.
;
; Examples:
; "STEAM_0:0:12345678" "vip_ct" 0
; "PlayerName" "vip_tero" 1