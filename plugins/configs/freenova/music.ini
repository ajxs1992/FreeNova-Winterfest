; FreeNova Round-End Music & MVP Fanfare - precache list
; File: addons/amxmodx/configs/freenova/music.ini
;
; Consumed by freenova_roundmusic.amxx in plugin_precache(): every listed
; path is registered with precache_generic() so clients download it, then
; played client-side with "mp3 play <path>".
;
; Rules:
;   - Paths are relative to the mod dir (cstrike/) and MUST start with "sound/".
;   - .mp3 only (GoldSrc mp3 player). Files not present on the server are
;     skipped with a log line - the server runs green without them.
;   - Empty lines and lines starting with ';' are ignored.
;   - "mp3 play" replaces whatever the client is playing: round music starts
;     at round end; the MVP fanfare (if enabled) cuts the MVP player's music
;     ~0.3s later - other players keep the round track.
;   - Music stops on the next round (HLTV new round -> "mp3 stop").
;   - One random track per event, up to 16 per section.
;
; Drop files under e.g. cstrike/sound/freenova/music/ (repo AND live tree -
; three-tree sync rule: newest file wins live -> repo).
;
; Sections:
;   [t_win]  - Terrorists win the round
;   [ct_win] - Counter-Terrorists win the round
;   [mvp]    - MVP fanfare sound (played only to the MVP, only when
;              fnmvp_enabled 1; leave empty for HUD-only fanfare)
;
; Enabling the MVP fanfare (OFF by default - four MVP announces already
; exist: rsu_core rank HUD "MVP of the Round %s (%d kills %d dmg)",
; freenova_competitive chat "[FreeNova] %s is the round MVP (+25)",
; freenova_panel STAT_MVP, battlepass "Top 1 MVP +15"):
;   1. Check addons/amxmodx/configs/rank_system_ultimate.ini: MVP_HUD_ENABLE
;      (set 0 if the fanfare HUD should be the single MVP surface; the
;      fanfare uses HUD channel 2 / y 0.35 vs rank's default channel /
;      y 0.22, so both-on is visible but redundant).
;   2. amxx.cfg (or server console): fnmvp_enabled 1
;   3. Optional: a track under [mvp] below.

[t_win]
sound/freenova/music/round_win_t.mp3

[ct_win]
sound/freenova/music/round_win_ct.mp3

[mvp]
sound/freenova/music/mvp_fanfare.mp3
