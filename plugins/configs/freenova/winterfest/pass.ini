; ============================================================================
; FreeNova Winterfest 2026 - the Winter Pass, 30 free tiers
; File: addons/amxmodx/configs/freenova/winterfest/pass.ini
; ============================================================================
; Owner decision 6.2: 30 tiers, FREE TRACK ONLY. There is no premium column in
; this file, none in the nvault schema and none in the panel - if that ever
; changes, the BattlePass machinery already has the shape, but nothing here
; creates a paid path.
;
; This file is the [pass] section of configs/freenova/winterfest.ini - the one
; file winterfest_core.amxx opens. Merge the rows there under [pass]; see
; docs/WINTERFEST-CONTENT.md.
;
; ----------------------------------------------------------------------------
; FORMAT  tier | xp | type | id | amount
; ----------------------------------------------------------------------------
;   tier    1..30 (WF_MAX_TIERS). A tier row must exist for the tier to exist.
;   xp      CUMULATIVE Winter Pass XP that opens this tier - not the step size.
;           Values must strictly increase; the loader clamps a row that goes
;           backwards to "previous tier + 1" and logs it, because a tier that
;           goes backwards would let a player re-claim a reward key.
;   type    snow | ornament | gift | title | pass   (same vocabulary as [advent])
;             snow     -> amount snowflakes
;             ornament -> id from ornaments.ini
;             gift     -> id = present rarity 0/1/2
;             title    -> id = [set] id
;             pass     -> amount Winter Pass XP (not used here; it would be a
;                         step that pays itself)
;   id      catalogue id (0 for snow)
;   amount  the magnitude for snow (0 for ids)
;
; ----------------------------------------------------------------------------
; WHY TIER 1 IS 0 XP
; ----------------------------------------------------------------------------
; WfTierFromXp() starts at tier 1 and only moves up, so a player with 0 XP is
; already tier 1 and WfSyncTiers() pays every tier from 1 up to the one held.
; A non-zero tier-1 threshold would therefore change nothing except the number
; in the panel: tier 1 is the welcome reward, paid on the first sync. So it is
; listed at 0 XP, which is what the code actually does - tiers 2..30 are the
; ones that cost anything.
;
; Two behaviours worth knowing because they are the core's, not this file's:
;   * an ornament tier whose ornament the player already owns is converted to
;     snow (20 common / 40 uncommon / 60 rare) instead of paying nothing
;     (WfSubstituteOwned), so a tier never evaporates;
;   * every tier is granted once through the claim ledger (key "tier#N"), so a
;     reconnect, a reset replay or a double XP event cannot pay it twice.
;
; ----------------------------------------------------------------------------
; PACING (the arithmetic, so a rebalance is a calculation and not a guess)
; ----------------------------------------------------------------------------
;   tiers  1-10   +300 XP each    ->      0 .. 2 700     (early: 3-4 tiers a day
;                                                        for a regular player)
;   tiers 11-20   +700 XP each    ->  3 400 .. 9 700     (~1 tier per day)
;   tiers 21-30   +1400 XP each   -> 11 100 .. 23 700    (late: ~1 tier every
;                                                        day and a half)
;   total: 23 700 XP over 24 playable days = just under 1 000 XP/day, which is
;   about one tier per day of normal play with presents, Advent claims and the
;   seasonal missions feeding it. A player who logs in every day finishes tier
;   30 on the 24th; a casual player lands in the mid-teens; nobody is locked
;   out and nothing expires before the season closes.
;
; XP comes from: opening presents (rarity-weighted), Advent claims, seasonal
; missions, and the 12 Days windows. All of it lands in one pass-XP value that
; is capped at the last tier's threshold, so the bar never overflows.
;
; ----------------------------------------------------------------------------
; REWARDS
; ----------------------------------------------------------------------------
; 18 snow rows (5 650 snowflakes total), 8 ornaments spread across all six
; sets, 3 presents (one uncommon, two rare) and the set-6 title at tier 30.
; Every reward is an id from ornaments.ini, so the pass cannot invent an
; ornament that does not exist - tools/winterfest tests verify that.
; ============================================================================

