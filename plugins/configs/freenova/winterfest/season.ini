; ============================================================================
; FreeNova Winterfest 2026 - season window, present counts, death pouch
; File: addons/amxmodx/configs/freenova/winterfest/season.ini
; ============================================================================
; Owner decisions behind this file: docs/WINTERFEST.md section 6.3 (the season
; closes 24 December 23:59 Europe/Paris; a missed Advent day stays claimable
; until then, at half value) and section 6.4 (6-10 presents per map, default 8;
; dying never drops a present, it drops a snowflake pouch).
;
; WHO READS THIS
;   [season]   winterfest_core.amxx, loadConfig() -> the date gate every module
;              asks through wf_season_open(). Keys are the ones the plugin
;              understands; anything else is ignored, so the two documentation
;              keys below (timezone, notes) are harmless.
;   [pouch]    winterfest_gifts.amxx, parsePouch() -> the death drop.
;   [present_defaults]
;              tools/winterfest/gen_spots.py -> how many rows per map it writes
;              into presents.ini. The plugins do NOT read this section; it is
;              input for the generator so the "default 8, min 6, max 10"
;              decision lives in data instead of inside a Python constant.
;
; This file is a content-pack section: the same keys are meant to be merged
; into configs/freenova/winterfest.ini (owned by the core/menu agent), which is
; the one file the plugins actually open. See docs/WINTERFEST-CONTENT.md.
;
; DATES
;   start / end are read by WfDateKey(), which keeps the first eight digits, so
;   "2026-12-01 00:00" becomes 20261201. The time of day is for humans; the
;   plugin compares calendar dates only. The comparison uses the SERVER's local
;   clock (get_time("%Y%m%d")), so the host must run Europe/Paris for the season
;   to open and close at the times below - the timezone key records the intent
;   for whoever provisions the host.
; ============================================================================

[season]
; Displayed by /christmas, the MOTD header and the panel.
name = Winterfest
year = 2026

; 1 December 2026, 00:00 Europe/Paris - the Advent calendar's day 1.
start = 2026-12-01 00:00

; 24 December 2026, 23:59 Europe/Paris - presents stop, Advent closes, the
; tree and the pass stay readable (nothing is deleted at the end).
end = 2026-12-24 23:59

; The Advent deadline is a separate key on purpose: a season could run into
; January while the calendar still has to shut on the 24th.
advent_end = 2026-12-24 23:59

; Documentation only (the plugin ignores it): the server must run this zone.
timezone = Europe/Paris

; 0 closes Winterfest without deleting the config (the cvar wf_enabled does the
; same thing at runtime; either one being off is enough).
enabled = 1

; ============================================================================
; [pouch] - what a death leaves behind on the ground
; ============================================================================
; Owner decision 6.4: dying never drops a present and never costs the victim
; anything. Kill someone and a small glowing pouch is left where they fell,
; worth a few snowflakes, for whoever reaches it first. It expires so a long
; round cannot carpet the map with them.
;
;   snow    snowflakes inside the pouch (1..1000)
;   life    seconds before it fades (5..120)
;   enable  0 turns the drop off entirely
;
; Three rules in the plugin, not here: a bot's death drops nothing, a suicide
; drops nothing, and a pouch pays exactly once even if two players reach it in
; the same 0.2 s scan.
[pouch]
snow = 5
life = 30
enable = 1

; ============================================================================
; [present_defaults] - how many spots gen_spots.py writes per map
; ============================================================================
; Generator input, not plugin config. The generator clamps --count into
; [min, max] and uses `default` when no --count is given. Lowering `max` below
; the number of rows already in presents.ini is a verification failure, not a
; silent trim: tools/winterfest/gen_spots.py --check will say so.
[present_defaults]
default = 8
min = 6
max = 10
