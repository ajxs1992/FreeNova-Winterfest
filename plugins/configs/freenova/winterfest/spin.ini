; ============================================================================
; FreeNova Winterfest 2026 - the Spin Wheel: sectors, odds, caps (workstream 13)
; File: addons/amxmodx/configs/freenova/winterfest/spin.ini
; ============================================================================
; Owner decision 2026-11-22 (docs/design/WINTERFEST-DASHBOARD.md, "Spins 0" in
; the top bar): the wheel ships. One free spin per player per day plus spins that
; are earned (Advent, pass tiers, presents, gifts) or granted by an admin. A spin
; consumes one token and pays one prize from the weighted table below.
;
; WHO READS THIS FILE
;   winterfest_spin.amxx reads it directly - it is NOT a section of
;   configs/freenova/winterfest.ini. winterfest_core.amxx knows nothing about
;   this file: it owns the spin COUNTER ([spins] in winterfest.ini) and this file
;   owns the wheel and the prizes. Deleting this file leaves the counter and the
;   earned tokens intact and simply makes the wheel unavailable (one log line).
;
; RELOAD: `wfspin_reload` on the server console (or a map change). Nothing is
; cached across a reload that a running wheel depends on: the sector table is
; re-read between spins, never mid-reveal.
;
; ----------------------------------------------------------------------------
; [wheel] - the counter side, the caps and the reveal
; ----------------------------------------------------------------------------
; free_per_day   what the daily free spin is worth, for DISPLAY and for the
;                page/in-game copy only. The authority is winterfest.ini's
;                [spins] free_per_day: the core owns the daily grant (its claim
;                key is spin#<YYYYMMDD>, one per calendar day). Keep the two
;                numbers equal - a mismatch is reported at boot with one line.
; reset_hour     0..23, the hour of the daily reset. 0 is the value that matches
;                the implementation: the core's claim key is the calendar day, so
;                the boundary is midnight. This module uses it to answer "when
;                does my free spin come back" - it never grants the daily itself.
; timezone       Europe/Paris (docs/WINTERFEST.md §6). The server must run on
;                this timezone for the reset the players are told to be true;
;                docs/WINTERFEST-SPIN.md §2 says how to check that.
; max            tokens a player may hold. `wfspin_grant` refuses past it (and
;                says so), so a gift, an Advent day or an admin cannot silently
;                build a pile nobody spends. The core's own ceiling is 1e6; this
;                is the product cap the brief asks for.
; fade_rarity    the wheel rarity from which the reveal also fades the screen:
;                common | uncommon | rare | legendary. "rare" = the top ~5 % of
;                spins, which is what makes the fade mean something.
; step           seconds between reveal steps (0.4 .. 1.5). Four steps, so the
;                whole reveal is 4 x step: 0.65 -> 2.6 s, the brief's "~2.5 s".
; enabled        0 stops /spin without touching balances, config or the counter.
;
; ----------------------------------------------------------------------------
; [sector] - the wheel itself, 8..12 rows, IN FILE ORDER = WHEEL ORDER
; ----------------------------------------------------------------------------
; FORMAT  label | kind | amount | weight | rarity
;
;   label    what the player sees on the wheel and in the prize table. Keep it
;            short (<= 18 chars): it is drawn around a circle in game and on the
;            panel's SVG. Not a format string - it is printed with %s.
;   kind     gingerbread | coins | ornament | title | spin | gift | nothing
;              gingerbread  amount = GingerBread paid through the core's ledger
;              coins        amount = coins paid through the BattlePass wallet
;                           (menabp_add_coins_once, so it cannot pay twice)
;              ornament     amount = ornament id, or 0 for "a random one you do
;                           not own yet" (0 is the recommended value: a fixed id
;                           disappears from the wheel the day you own it)
;              title        amount = [set] id from winterfest.ini; pays that
;                           set's collector title
;              spin         amount = tokens added back to the counter
;              gift         amount = present rarity 0/1/2 (a present to open)
;              nothing      amount = 0; the wheel stopped on a gap
;   amount   see above. 0 is legal only for `nothing` and the two "random"
;            forms (`ornament` with 0).
;   weight   relative weight, INTEGER >= 2 (a 1/100 sector is inside the noise
;            of the 1000-roll check and hides config mistakes). The chance of a
;            sector is weight / sum(weights). Reordering rows never changes an
;            odd; changing one row does, so re-run the odds harness (see below).
;   rarity   cosmetic, for the reveal colour and the fade ONLY:
;            common #9fb0d0 | uncommon #3fbf6f | rare #4070c0 | legendary #f5c451
;            (the dashboard reference's palette; docs/design/WINTERFEST-DASHBOARD.md)
;
; PAYMENT AND ELIGIBILITY
;   The token is consumed BEFORE the prize is paid, the claim key is written
;   before the announcement, and a prize whose API is not ready for this player
;   (coins before the wallet loads, an ornament already owned, a full present
;   bag) is EXCLUDED from the roll rather than paid as nothing. The wheel still
;   shows every sector; in game, an excluded sector is announced once with
;   "skipped: already yours" and its weight is redistributed over the rest.
;   docs/WINTERFEST-SPIN.md §4 has the exact rules.
;
; ODD ARITHMETIC (so a rebalance is a calculation, not a guess)
;   shipped table: weights 12+20+18+12+10+8+9+6+3+2 = 100
;     nothing            12 %      common
;     gingerbread small  20 %      common
;     gingerbread mid    18 %      common
;     coins small        12 %      common
;     coins big          10 %      uncommon
;     extra spin          8 %      uncommon
;     common present      9 %      common
;     ornament            6 %      uncommon
;     collector title     3 %      rare
;     rare present        2 %      rare
;   -> 71 % common, 24 % uncommon, 5 % rare-or-better per spin.
;   Expected GingerBread per spin: 0.20*5 + 0.18*15 = 3.7, plus the presents it
;   hands out; a token is worth roughly 4 GingerBread and a fifth of a present.
; ============================================================================

[wheel]
free_per_day = 1
reset_hour   = 0
timezone     = Europe/Paris
max          = 10
fade_rarity  = rare
step         = 0.65
enabled      = 1


; ----------------------------------------------------------------------------
; label               | kind        | amount | weight | rarity
; ----------------------------------------------------------------------------

[sector]

Nothing            | nothing     | 0      | 12     | common
5 GingerBread      | gingerbread | 5      | 20     | common
15 GingerBread     | gingerbread | 15     | 18     | common
25 Coins           | coins       | 25     | 12     | common
75 Coins           | coins       | 75     | 10     | uncommon
1 Extra Spin       | spin        | 1      | 8      | uncommon
Common Present     | gift        | 0      | 9      | common
Mystery Ornament   | ornament    | 0      | 6      | uncommon
Collector Title    | title       | 6      | 3      | rare
Rare Present       | gift        | 2      | 2      | rare
