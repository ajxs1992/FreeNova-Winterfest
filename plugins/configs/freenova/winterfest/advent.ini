; ============================================================================
; FreeNova Winterfest 2026 - the Advent calendar, 1..24 December
; File: addons/amxmodx/configs/freenova/winterfest/advent.ini
; ============================================================================
; One row per day. Day n unlocks on n December 2026 (Europe/Paris); a day that
; was missed stays claimable until the season closes on 24 December 23:59.
; Owner decisions: WINTERFEST.md section 6.3 (dates, the half-value catch-up)
; and section 4.7 (the data lives in config).
;
; This file is the [advent] section of configs/freenova/winterfest.ini - the one
; file winterfest_core.amxx opens. Merge the rows there under [advent]; see
; docs/WINTERFEST-CONTENT.md.
;
; ----------------------------------------------------------------------------
; FORMAT  day | type | id | amount
; ----------------------------------------------------------------------------
;   day     1..31 (WF_MAX_ADVENT). A day with no row simply has nothing to
;           claim, so the calendar can be shorter than the month.
;   type    snow   (or snowflakes) -> amount is how many snowflakes
;           ornament               -> id is an [ornament] id
;           gift   (or present)    -> id is a present rarity (0/1/2)
;           pass   (or xp)         -> amount is Winter Pass XP
;           title                  -> id is a [set] id (its title text)
;   id      the catalogue id the type needs (0 for snow/pass)
;   amount  the magnitude for snow/pass (0 for ids)
;
; A row the plugin cannot resolve (unknown type, id out of range, an ornament
; that does not exist) is skipped with a log line and that day shows "nothing
; today" instead of paying something wrong.
;
; ----------------------------------------------------------------------------
; THE HALF-VALUE CATCH-UP RULE (documented here, applied by the code)
; ----------------------------------------------------------------------------
; A day claimed ON its date pays the amount in this file. A day claimed LATE -
; any time after its date, up to the season close - pays HALF, and the HUD/menu
; says "late claim: half value".
;
; Exactly what "half" means, per WfHalfValue() in winterfest_core.sma:
;   * snow and pass-XP rows: floor(amount / 2), with a floor of 1, so a 300-snow
;     day pays 150 late and a 45-snow day still pays 22;
;   * ornament, gift and title rows: paid AS-IS - an ornament has no smaller
;     unit, and halving a title would mean nothing. The day still pays exactly
;     once either way.
; An ornament the player already owns is converted to snow (20 common / 40
; uncommon / 60 rare) by WfSubstituteOwned, so a late day can never pay nothing.
;
; This file always lists the FULL value: the halving is one arithmetic step in
; wf_advent_claim(), not 24 pairs of numbers that would drift apart the first
; time someone rebalances a tier. It also means the same row serves both cases,
; and a future "no catch-up penalty" event is a plugin flag, not a rewrite of
; the calendar.
;
; Why have the rule at all (section 6.3): a late joiner is not punished for
; arriving on the 10th, and nobody can cheapen days 1-8 by skipping them and
; claiming everything in one go at the end.
;
; ----------------------------------------------------------------------------
; THE CURVE
; ----------------------------------------------------------------------------
;   days 1-8    snowflakes only, 40 -> 90   (a new player's first currency)
;   days 9-19   an ornament every other day, snow in between
;   days 20-23  the good ornaments, a rare present, a 300-snow day
;   day 24      the Winterfest Legend badge (set 6's title)
;
; Total: 1310 snowflakes, 8 ornaments, 2 presents, 1 title. Day 24 grants the
; set-6 TITLE as a badge; the Winterfest Legend weapon pack still needs all six
; collections complete (see ornaments.ini), so the badge is a souvenir, not the
; collection reward.
; ============================================================================

[advent]
; day | type | id | amount
1  | snow     | 0  | 40
2  | snow     | 0  | 45
3  | snow     | 0  | 50
4  | snow     | 0  | 55
