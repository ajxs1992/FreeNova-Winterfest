; ============================================================================
; FreeNova Winterfest - presents in the world, one row per spot
; ============================================================================
; GENERATED FILE - do not hand-edit.
;   generator: tools/winterfest/gen_spots.py (content pack v1)
;   source:    the entity lump of every map in game-server/cstrike/mapcycle.txt
; A hand edit is lost on the next run. A one-off tweak belongs in winterfest.ini's
; [presents] section instead (this file is the generated block to merge there).
;
; REGENERATE
;   every map:   python3 tools/winterfest/gen_spots.py --write
;   one map:     python3 tools/winterfest/gen_spots.py --write --map <map>
;   verify:      python3 tools/winterfest/gen_spots.py --check
;
; FORMAT  (read by winterfest_gifts.amxx -> WfAddSpot; '|' separated, trimmed)
;   map | x y z | rarity | respawn
;     map       BSP name without .bsp, as spelled in mapcycle.txt
;     x y z     origin in map units; three numbers, |x|,|y|,|z| <= 8000
;     rarity    0 = common, 1 = uncommon, 2 = rare (names, colours and roll
;               weights come from the [rarity] rows in winterfest.ini)
;     respawn   seconds until the present returns (10..900, clamped by the
;               plugin); 120 is the owner's Phase 1 value
;
; WHERE THE SPOTS COME FROM
;   A spot is a real spawn origin from the map's own entity lump, so it is on
;   the floor, outside geometry and inside a play area - no hand placement.
;   Candidates: info_player_start / info_player_deathmatch, then
;   info_player_terrorist / counterterrorist, then info_target, then item_*
;   (the last two only when a map cannot fill 6 spots from spawns). Origins
;   below z -2000 or outside the world model's bounding box are dropped.
;   Spots are chosen by farthest-point sampling (the best walk over every
;   possible start point): spread over the whole map, no two closer than 300
;   units, identical on every run. Rarity is a 55/30/15 quota per map, shuffled
;   with a seed taken from the map name.
;
; SPOTS PER MAP - target 8; the owner's range is 6-10 (WINTERFEST.md 6.4)
;   A map gets 8 spots when its own spawn entities allow it, and fewer
;   when they do not: no two spots may be closer than 300 units, so a cramped or
;   spawn-concentrated map ends up with 6 or 7. The count is NEVER padded with
;   info_target camera anchors to reach the target - those sit at camera height
;   and the pickup radius is 60 units from the player's feet, so a padding spot
;   could never be collected - and no coordinate is invented. Each map's own
;   comment below says "N of 8" when it is short, with the reason.
;   Below target today (10 of 25 maps), separation-limited:
;   de_tuscan (7), de_dust2 (7), de_inferno (6), de_train (7), de_piranesi (6)
;   cs_italy (7), de_airstrip (7), de_chateau (7), de_survivor (6)
;   cs_backalley (6)

; A map with no rows here is not broken: winterfest_gifts falls back to its
; built-in @t/@ct spawn set (8 spots) and logs which path it took.
;
; 25 maps, 186 spots.
; ============================================================================

