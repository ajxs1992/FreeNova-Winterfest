; ============================================================================
; FreeNova Winterfest - progression extras (workstream 9)
; File: addons/amxmodx/configs/freenova/winterfest/progress.ini
;
; Read by winterfest_progress.amxx once, at map start (plugin_init). A change
; applies on the next map change or the next `amx_reload`; it is never re-read
; mid-map.
;
; This file owns the SEASON WINDOW of the progression layer only. The core has
; its own window in configs/freenova/winterfest.ini ([season]); the two are
; deliberately separate files so this module can be switched off (or run for a
; shorter window, as here) without touching the core's data.
;
; The window here is 1-24 December 2026 23:59, i.e. the Advent calendar's
; deadline (docs/WINTERFEST.md §6.3) rather than the core's 31 December. That is
; intentional: missions, seasonal achievements and the daily login belong to the
; calendar part of the season.
;
; OUTSIDE THE WINDOW NOTHING HAPPENS. Not "nothing much": no vault is opened, no
; hooks or tasks are registered, no player-facing line is printed, and the two
; commands this module adds are not registered at all. The plugin writes exactly
; one log line saying the window is closed, so an operator can tell the
; difference between "dormant" and "not loaded". See
; docs/WINTERFEST-PROGRESS.md §5 for the boot log to expect.
;
; Lines starting with ';' or '#' are comments. `key = value` in [season],
; [login] and [settings]. A value that fails validation is reported with one
; log line and the safe default is used - a mistake in here must never take the
; server down or open a season by accident.
; ============================================================================


[season]
; ----------------------------------------------------------------------------
; name       shown in the menus, the chat lines and the log.
; year       season stamp. Every nvault key this module writes carries it, and
;            so does every claim key, so bumping it next December starts clean
;            without deleting one byte of this year's records.
; start/end  the window, "YYYY-MM-DD HH:MM" (the HH:MM is optional, default
;            00:00). Read against the SERVER clock, which the live box runs in
;            Europe/Paris - AMXX has no timezone database, so the timezone is
;            named here for the reader and the clock is the clock. A UTC box
;            moves the boundary by an hour or two, which changes when the
;            window opens, never whether a reward pays twice.
; enabled    0 closes the layer without touching anything else. It is the same
;            switch as a closed window; "enabled" is what an operator flips,
;            "start/end" is what the calendar does.
; ----------------------------------------------------------------------------
name    = Winterfest 2026
year    = 2026
start   = 2026-12-01 00:00
end     = 2026-12-24 23:59
enabled = 1


[login]
; ----------------------------------------------------------------------------
; The cheapest retention lever in the update: the first connect of the day
; pays a small snowflake bundle, once per player per day.
;
; enabled    0 turns the daily gift off without touching the window.
; snowflakes what the bundle is worth, in the season currency. The key keeps the
;            old name for compatibility (the early week called it "snowflakes");
;            `gingerbread` is accepted as a synonym. docs/WINTERFEST-DEV.md: the
;            currency is GingerBread (id `gb`) and snowflakes is the legacy
;            alias, and the plugin prints whichever name winterfest.inc
;            defines (WF_CURRENCY_NAME), so this file never hardcodes it.
;            Small on purpose - it is a reason to log in, not a reason to farm;
;            the presents in the map are the farm.
;
; Idempotency: the claim key is wfprog_login#<season>#<YYYYMMDD>#<steamid>, and
; the core writes the claim BEFORE it pays, so a reconnect, a retry after a
; failed vault load, two connects in the same second, or a plugin restart all
; pay once and exactly once. The record also keeps the last paid date, so the
; common case (reconnect within the same day) does not even ask the core.
; ----------------------------------------------------------------------------
enabled    = 1
snowflakes = 25


[settings]
; ----------------------------------------------------------------------------
; legendary_rarity  which present rarity counts as "legendary" for the
;                   achievements and the `legendary` mission metric. It is the
;                   RARITY INDEX from [rarity] in winterfest.ini, not a name:
;                   the shipped season defines 0 Common / 1 Uncommon / 2 Rare,
;                   so 2 means "the top shelf". Change it here when a season
;                   renames or adds a shelf; the code never hardcodes a name.
;
; Everything else is deliberately not configurable: the 30 s autosave, the 2 s
; gift observation tick and the 10 s core read are fixed, so the numbers in
; docs/WINTERFEST-PROGRESS.md are the numbers that run.
; ----------------------------------------------------------------------------
legendary_rarity = 2
