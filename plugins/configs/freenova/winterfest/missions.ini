; ============================================================================
; FreeNova Winterfest - seasonal missions
; File: addons/amxmodx/configs/freenova/winterfest/missions.ini
;
; Loaded by winterfest_progress.amxx at map start, only when the season window in
; progress.ini is open. A change applies on the next map change; it is never read
; mid-map.
;
; WHY THIS FILE IS SEPARATE FROM configs/freenova/missions.ini
;   The base contract rotation (freenova_missions, 48 rows) is a year-round
;   system with its own slots, its own ledger and its own owner. Winterfest needs
;   content that appears only in December and cannot collide with that rotation.
;   So this is an ADDITIVE seasonal layer: the base plugin never reads this file,
;   nothing here touches a base slot, and deleting it stops the seasonal
;   contracts without touching the base ones.
;
; SHAPE: identical to the base missions.ini on purpose (same [settings] block,
; same [mission] block, same ten columns in the same order), so the panel's
; contract renderer can show these rows without a second parser. Two columns
; mean Winterfest things, because Winterfest has no coins and its XP is the
; Winter Pass:
;
;     xp     -> Winter Pass XP
;     coins  -> the season currency (GingerBread, id `gb`; docs/WINTERFEST-DEV.md.
;               It was called "snowflakes" during the first week, and
;               winterfest.inc still accepts both names as the same reward kind,
;               so a row written either way pays the same thing.)
;
; ----------------------------------------------------------------------------
; FORMAT
; ----------------------------------------------------------------------------
; Blank lines and lines starting with ';' or '#' are ignored; a ';' or '#' later
; on a line starts a trailing comment.
;
;   [settings]
;   season = 2026
;
;   [mission]
;   id | type | slot | metric | target | weight | xp | coins | season | tags
;
; One [mission] line = one possible contract for one slot. Several lines for the
; same type+slot are TARGET VARIANTS: one of them is picked per player, weighted
; by 'weight', deterministically (steamid + season + slot + period), so a
; reconnect never re-rolls the contract a player is half-way through.
;
; Fields, in order:
;   id      label used in log lines and in the admin/greppable output.
;   type    daily | weekly | season
;             daily   resets at midnight server time
;             weekly  resets on ISO week change
;             season  runs for the whole window, one attempt per player
;   slot    0-based slot inside that type. Fixed counts, do not raise them:
;             daily 0-5, weekly 0-3, season 0-7. A slot with no valid row is
;             simply unused. This file ships 5 daily + 3 weekly + 6 season.
;   metric  what advances the slot (see the table below).
;   target  progress needed. Must be > 0.
;   weight  relative chance among the rows sharing type+slot. 0 = row kept in
;           the file but never rolled, which is how a contract for a mode that
;           has not shipped yet is staged (see season_snowball_1 at the end).
;   xp      Winter Pass XP paid when the contract completes. 0 = nothing.
;   coins   snowflakes paid when the contract completes. 0 = nothing.
;   season  season tag. A row whose season does not match [settings] season is
;           skipped at load, so next December's rows can be staged here early.
;           Empty = inherit [settings] season.
;   tags    free-form, comma separated. TWO tags are read:
;             map=<mapname>  required by map_rounds (which map counts)
;             any other tag  ignored, reserved for the panel
;
; ----------------------------------------------------------------------------
; METRICS
; ----------------------------------------------------------------------------
;   kills        kills. A bot may be the victim (that is how the base contracts
;                count too); a bot may never be the attacker.
;   headshots    headshot kills.
;   streak       best kill streak inside the period (max, not additive).
;   rounds       rounds started while the player is connected.
;   map_rounds   rounds started on the map named by the map= tag.
;   wins         rounds won (via the rsu_core round-win forward; the fallback is
;                documented in docs/WINTERFEST-PROGRESS.md §6).
;   presents     presents picked up (the core's present inventory).
;   opens        presents opened.
;   legendary    presents of the [settings] legendary_rarity picked up and then
;                opened (top-shelf finds).
;   advent       Advent days claimed.
;   sets         secret collections completed.
;   tree         tree LEVEL reached (tree and pass_tier are levels, so they are
;                refused in a daily or weekly contract: a level does not reset).
;   pass_tier    Winter Pass tier reached.
;   snowball_hs  snowball headshots. This mode belongs to workstream 7; the
;                metric only advances when that module reports it through
;                native wfprog_report(id, "snowball_hs", 1).
;
; Rows that fail validation are skipped with
;   [WF-PROG] missions.ini: line N: <reason>
; A file with no valid row leaves the seasonal layer with no contracts: the
; plugin still loads, the daily login still works, and nothing is invented.
; ============================================================================


[settings]
season = 2026


; ----------------------------------------------------------------------------
; DAILY - 5 slots, reset at midnight server time
; ----------------------------------------------------------------------------
[mission]
;      id                 | type  | slot | metric    | target | weight | xp  | coins | season | tags
daily_presents_3          | daily | 0    | presents  | 3      | 1      | 60  | 80    | 2026   | daily,presents
daily_presents_5          | daily | 0    | presents  | 5      | 1      | 80  | 120   | 2026   | daily,presents

daily_opens_2             | daily | 1    | opens     | 2      | 1      | 50  | 60    | 2026   | daily,opens
daily_opens_3             | daily | 1    | opens     | 3      | 1      | 70  | 90    | 2026   | daily,opens

daily_kills_10            | daily | 2    | kills     | 10     | 1      | 80  | 100   | 2026   | daily,kills
daily_kills_20            | daily | 2    | kills     | 20     | 1      | 120 | 150   | 2026   | daily,kills

daily_headshots_3         | daily | 3    | headshots | 3      | 1      | 60  | 80    | 2026   | daily,headshots

daily_rounds_5            | daily | 4    | rounds    | 5      | 1      | 40  | 60    | 2026   | daily,rounds


; ----------------------------------------------------------------------------
; WEEKLY - 3 slots, reset on ISO week change
; ----------------------------------------------------------------------------
[mission]
;      id                 | type   | slot | metric    | target | weight | xp  | coins | season | tags
weekly_presents_25        | weekly | 0    | presents  | 25     | 1      | 250 | 300   | 2026   | weekly,presents
weekly_presents_40        | weekly | 0    | presents  | 40     | 1      | 350 | 450   | 2026   | weekly,presents

weekly_opens_15           | weekly | 1    | opens     | 15     | 1      | 200 | 250   | 2026   | weekly,opens

weekly_streak_6           | weekly | 2    | streak    | 6      | 1      | 200 | 250   | 2026   | weekly,streak
weekly_streak_9           | weekly | 2    | streak    | 9      | 1      | 300 | 350   | 2026   | weekly,streak


; ----------------------------------------------------------------------------
; SEASON - 6 active slots, one attempt per player for the whole window.
; The completion is the season stamp in the claim key, so these pay once and
; never come back, even after a reconnect or a map change.
; ----------------------------------------------------------------------------
[mission]
;      id                 | type   | slot | metric       | target | weight | xp  | coins | season | tags
season_dust2_10           | season | 0    | map_rounds   | 10     | 1      | 150 | 200   | 2026   | season,map,map=de_dust2
season_mirage_8           | season | 1    | map_rounds   | 8      | 1      | 150 | 200   | 2026   | season,map,map=de_mirage

season_advent_12          | season | 2    | advent       | 12     | 1      | 250 | 300   | 2026   | season,advent

season_collection_1       | season | 3    | sets         | 1      | 1      | 300 | 400   | 2026   | season,collection

season_tree_3             | season | 4    | tree         | 3      | 1      | 250 | 300   | 2026   | season,tree

season_legendary_2        | season | 5    | legendary    | 2      | 1      | 400 | 500   | 2026   | season,legendary

; STAGED (weight 0 = kept, never rolled): the snowball mode is workstream 7's
; file and may not ship. The row exists so the contract appears in the file and
; in the panel's data, and turning it on is a one-character edit on the day the
; mode reports through native wfprog_report(id, "snowball_hs", 1).
season_snowball_1         | season | 6    | snowball_hs  | 1      | 0      | 200 | 250   | 2026   | season,snowball,staged
