; FreeNova Winterfest 2026 - the Twelve Days, 13..24 December
; File: addons/amxmodx/configs/freenova/winterfest/12days.ini
; ============================================================================
; DRAFT FOR THE COORDINATOR. This file is NOT loaded by anything: the scheduled
; event windows live in configs/freenova/events.ini, which another agent owns.
; Part B below is paste-ready for that file's [window] section; Part A is the
; date-anchored plan the MOTD and Discord copy their one-liners from.
;
; Owner decision: WINTERFEST.md section 4, Phase 2 ("12 Days windows in
; events.ini - one per day, different multiplier").
;
; ----------------------------------------------------------------------------
; THE GAP YOU MUST KNOW ABOUT BEFORE MERGING (this is why Part A exists)
; ----------------------------------------------------------------------------
; freenova_randevent's window format is
;
;     id | days | start | end | flavor | multiplier
;
; and `days` is a WEEKDAY list (sun..sat), not a date. There is no date-range
; column, so no window row can say "13 December only". Consequences:
;
;   1. A row for `sun` fires on EVERY Sunday the server is up, not just the
;      13th and 20th. Twelve rows therefore repeat weekly, in December and in
;      July.
;   2. 13..24 December covers each weekday once, except Sun/Mon/Tue/Wed/Thu,
;      which appear twice. The two rows of each of those days are given an
;      early and a late slot (see Part A), so even without a date gate no two
;      rows share a weekday and a time: the plugin refuses to open a window
;      while another event owns the channel, and a collision would be a silently
;      skipped day. With a date gate in place the split slots are simply "the
;      theme for the afternoon" and "the theme for the evening".
;   3. The scheduler only runs while [settings] mode is `schedule` or `both`;
;      with the shipped `mode = random` these rows are inert.
;   4. MAX_WINDOWS is 16 and events.ini already uses 3, so 12 more fit - but
;      only just (15/16). The 7-row variant in Part C leaves room.
;
; Two honest ways to ship the 12 Days:
;
;   A. give freenova_randevent a date range (a `from`/`to` MM-DD column, or a
;      `dates = 12-13,12-20` field) and paste Part B once. That is the real
;      feature and the only way to have twelve different days.
;   B. ship Part C now: one window per weekday, using the strongest theme of
;      each weekday pair. It runs weekly, not for twelve days, and it is
;      labelled as such in the MOTD - but it needs no plugin change.
;
; Pick A if the plugin change lands before 13 December; otherwise B, and keep
; Part B as the acceptance test for A.
;
; ----------------------------------------------------------------------------
; PART A - THE PLAN: date | weekday | window id | theme | flavor | mult | time
; ----------------------------------------------------------------------------
; Each day has its own theme, and the magnitude climbs from 1.5 to 3.0 so the
; last days are the loudest. `flavor` is one of the four channels the server
; has: xp, coins, double (a 0/1 flag), happy.
;
; A repeated weekday is split into an early and a late slot so the two rows
; never collide: the 13th and the 20th are both Sundays, so the 13th runs
; 12:00-16:00 and the 20th runs 17:00-23:00. Same for Mon/Tue/Wed/Thu.
;
;  13 Sun  wf_d13_tree       Tree Lighting        coins  1.5   12:00-16:00
;  14 Mon  wf_d14_snowball   Snowball Skirmish    xp     2.0   16:00-19:00
;  15 Tue  wf_d15_cane       Candy Cane Rush      happy  2.0   16:00-19:00
;  16 Wed  wf_d16_wrap       Gift Wrap Wednesday  coins  2.0   16:00-19:00
;  17 Thu  wf_d17_reindeer   Reindeer Run         xp     1.5   16:00-19:00
;  18 Fri  wf_d18_frosty     Frosty Friday        double 1.0   18:00-23:00
;  19 Sat  wf_d19_bells      Sleigh Bell Saturday coins  2.0   14:00-23:00
;  20 Sun  wf_d20_grinch     Grinch's Gambit      xp     2.5   17:00-23:00
;  21 Mon  wf_d21_parade     Present Parade       coins  1.75  19:30-23:00
;  22 Tue  wf_d22_silent     Silent Night         happy  2.5   19:30-23:00
;  23 Wed  wf_d23_eve        Christmas Eve Eve    happy  3.0   19:30-23:00
;  24 Thu  wf_d24_finale     Christmas Eve Finale xp     3.0   19:30-23:00
;
; Every window ends at 23:00 and the season itself closes at 23:59 on the 24th,
; so the last window ends before the season does - no window can outlive its
; season, and none crosses midnight.
;
; ----------------------------------------------------------------------------
