; ----------------------------------------------------------------------------
; PART C - the safe-now variant: one window per weekday (7 rows, no change)
; ----------------------------------------------------------------------------
; Same themes, one per weekday, using the stronger of each repeated pair. This
; is the block to paste if the date range does not land before 13 December. It
; is a weekly winter rotation, and the MOTD should call it that.
;
; The section is deliberately named [window-safe-now]: freenova_randevent only
; parses [window]/[windows], so pasting this whole file into events.ini cannot
; load both variants by accident (it logs "unknown section" and moves on).
; Rename it to [window] after deleting Part B, and delete the old header.
[window-safe-now]
; id | days | start | end | flavor | multiplier
;
; Sundays the Grinch steals the XP curve: x2.5 all evening.
wf_sun_grinch     | sun | 17:00 | 23:00 | xp     | 2.5
; Mondays the snowballs fly: double XP.
wf_mon_snowball   | mon | 16:00 | 19:00 | xp     | 2.0
; Tuesdays are silent but loud: happy hour at x2.5.
wf_tue_silent     | tue | 19:30 | 23:00 | happy  | 2.5
; Wednesdays are for wrapping: coins x2.
wf_wed_wrap       | wed | 16:00 | 19:00 | coins  | 2.0
; Thursdays run the finale: triple XP.
wf_thu_finale     | thu | 19:30 | 23:00 | xp     | 3.0
; Fridays are frosty: double XP on the house.
wf_fri_frosty     | fri | 18:00 | 23:00 | double | 1.0
; Saturdays ring the sleigh bells: coins x2 all afternoon.
wf_sat_bells      | sat | 14:00 | 23:00 | coins  | 2.0

; ----------------------------------------------------------------------------
; MERGE CHECKLIST
; ----------------------------------------------------------------------------
;   1. events.ini [settings] mode must be `schedule` or `both`, or nothing here
;      runs. Keep `random` until the rows are in.
;   2. The four flavours are fixed names: xp, coins, double, happy. A typo makes
;      the plugin skip the row and log it - check the console after a restart.
;   3. `double` is a 0/1 flag, so its multiplier is always 1.0; xp/coins/happy
;      magnitudes are clamped to 1.0..5.0.
;   4. A window cannot cross midnight: every row above ends at 23:00, and no
;      two rows share a weekday and a time.
;   5. Only one channel is boosted at a time. Two windows overlapping on the
;      same weekday would mean the second is skipped (logged), which is why the
;      repeated weekdays in Part B are split into early and late slots.
;   6. Pasting Part B on top of Part C (or twice) duplicates ids: the plugin
;      treats every row as its own window, so delete the variant you did not
;      choose.
; ============================================================================
