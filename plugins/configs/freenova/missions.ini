; ============================================================================
; FreeNova Missions - contract definitions
; File: addons/amxmodx/configs/freenova/missions.ini
; Loaded by freenova_missions.amxx at map start (plugin_cfg). A change applies on
; the next map change; it is never read mid-map.
;
; This file replaces the contract table that used to be compiled into the
; plugin. The rows shipped here are the 1:1 equivalent of that old hardcoded
; table, so copying this file in changes nothing. Edit targets, weights and
; rewards to change what players pull.
;
; ----------------------------------------------------------------------------
; FORMAT
; ----------------------------------------------------------------------------
; Two kinds of block. Blank lines and lines starting with ';' or '#' are
; ignored. A ';' or '#' anywhere else starts a trailing comment.
;
;   [settings]
;   key = value
;
;   [mission]
;   id | type | slot | metric | target | weight | xp | coins | season | tags
;
; One [mission] line = one possible contract for one slot. Several lines for
; the same type+slot are TARGET VARIANTS: the roll picks one of them per player,
; at random, weighted by the 'weight' column. That is how the old "pool of four
; targets" is expressed (4 rows, weight 1 each = same 25% chance each).
;
; Fields, in order:
;   id      unique-ish label, used in log lines only. Not shown in game yet.
;   type    daily | bonus | weekly | vip
;   slot    0-based slot inside that type. Fixed counts, do not raise them:
;           daily 0-4, bonus 0-2, weekly 0-3, vip 0. The panel, the HUD
;           tracker and freenova_sync read progress by slot index, so the
;           COUNT of slots is part of the server protocol. A slot with no
;           valid row is simply unused (it is marked claimed and never rolled).
;   metric  what advances the slot:
;           kills | headshots | plants | defuses | wins | streak | damage | survives
;           (aliases: frags= kills, hs= headshots, plants, bomb_plants= plants,
;            bomb_defuses= defuses, round_wins= wins, survive= survives)
;   target  progress needed. Must be > 0.
;   weight  relative chance among the rows sharing type+slot. 0 = row kept in
;           the file but never rolled (handy for staging next season).
;   xp      BP XP paid the moment THIS slot is claimed. 0 = nothing.
;   coins   coins paid the moment THIS slot is claimed. 0 = nothing.
;   season  season tag. A row whose season does not match [settings] season is
;           skipped at load (so next season's rows can be staged here early).
;           Empty = inherit [settings] season.
;   tags    free-form labels, comma separated, reserved for the panel. Not read
;           by the plugin today.
;
; Rows that fail validation are skipped with a
; "[FreeNova Missions] missions.ini: line N: <reason>" log line. A group with no
; valid row at all (all skipped, or the whole file missing) falls back to the
; built-in default table and logs one warning - the server always stays playable.
;
; ----------------------------------------------------------------------------
; WHAT PAYS WHAT
; ----------------------------------------------------------------------------
; A slot pays its own xp/coins when claimed. On top of that, finishing a SET
; (the last claim of that type) pays the set bonus from [settings]:
;   daily  -> daily_set_xp / daily_set_coins    (500 XP, no coins)
;   weekly -> weekly_set_xp / weekly_set_coins  (5000 XP + 1000 coins)
;   bonus  -> none (each slot pays its own coins)
;   vip    -> none (the VIP slot pays its own coins and is VIP-only)
; Set bonuses are keyed per day / per ISO week, so they cannot be paid twice.
;
; The VIP slot is gated in code on fnvip tier >= VIP: no config here can make a
; non-VIP player earn it.
; ============================================================================

[settings]
; Season tag stamped on every contract. Empty = accept rows of any season.
season            = 1

; Set-completion bonuses (see above).
daily_set_xp      = 500
daily_set_coins   = 0
weekly_set_xp     = 5000
weekly_set_coins  = 1000

; How many claimed slots complete a set. 0 = all defined slots of that type.
; 4 with five daily slots means "claim any 4 of the 5" - the 5th stays claimable.
daily_set_slots   = 0
weekly_set_slots  = 0

