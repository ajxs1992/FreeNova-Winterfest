daily_frags_25        | daily | 0    | kills     | 25     | 1      | 0  | 0     | 1      | daily,frags
daily_frags_40        | daily | 0    | kills     | 40     | 1      | 0  | 0     | 1      | daily,frags

daily_hs_2            | daily | 1    | headshots | 2      | 1      | 0  | 0     | 1      | daily,headshots
daily_hs_3            | daily | 1    | headshots | 3      | 1      | 0  | 0     | 1      | daily,headshots
