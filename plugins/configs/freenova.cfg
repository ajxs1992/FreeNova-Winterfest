// ============================================================
// FreeNova - SIMPLE CONFIG. Edit THIS file only. Everything
// else works out of the box. Lines starting with // are comments.
// ============================================================

// --- 1. Server identity ---
// LIVE-DEPLOY: operator sets this, pack default disabled: hostname "CHANGE-ME - FreeNova CS 1.6"
sv_password ""
// RCON password. CHANGE THIS before going public!
// LIVE-DEPLOY: operator sets this, pack default disabled: rcon_password "CHANGE-ME-USE-A-LONG-RANDOM-PASSWORD"

// --- 2. Contact / community URLs (shown in menus, scan msgs) ---
amx_contact "Discord: CHANGE-ME"
// Ban-list website shown to players (or leave empty):
// ab_website "https://bans.CHANGE-ME.example"

// --- 3. Postgres (preset C / dashboard ONLY) ---
// Leave everything as-is until Postgres exists. Keep pg_dryrun 1
// until pg_connect_test + pg_setup + pg_status + pg_sync_now pass.
// The DB password lives in configs/pg_pass.txt (created by YOU
// from pg_pass.txt.example). It is NEVER put in this file.
pg_host "127.0.0.1"
pg_port "5434"
pg_user "CHANGE-ME"
pg_db "CHANGE-ME"
pg_passfile "addons/amxmodx/configs/pg_pass.txt"
pg_interval "60"
pg_dryrun "1"

// --- 4. Preset / map stack (see INSTALL.txt) ---
// Default install = preset A (file bans, modern maps). For B or C,
// copy configs/preset-b.ini (or -c) over plugins.ini.
// Map stack: installer default = modern (mapmanager+rtv). NOTE: RTV starts
// a vote only on the classic stack (mapchooser); on modern it reports that
// mapchooser is absent (classic-only by design until 3.0 M5). For classic
// (mapchooser+nextmap), swap the two pairs in plugins.ini.


// ---------------------------------------------------------------------------
// Discord (single source of truth for every plugin: FN_GetDiscordUrl reads it)
// ---------------------------------------------------------------------------
fn_discord_url "https://discord.gg/as8kzp5KAz"
fn_discord_handle "zizouondc"
