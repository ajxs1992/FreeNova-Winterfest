; FreeNova game-mode profiles (3.0 M9). Sections list cvar values; unknown
; cvars are skipped with a count (never created). Values are starting
; points - edit freely. Pair event/maintenance with amx_profiles (plugin
; pause sets). Zombie/dm/surf entries coexist with foreign gameplay mods:
; they tune engine cvars only and change no teams, spawns, or damage.
