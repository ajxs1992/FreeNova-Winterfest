; Top15 Styled config
; The plugin reads leaderboards from the FreeNova web MySQL database.
; With no web DB running, /topN commands show an error MOTD - harmless.
; Set WEBSITE_LINK to your FreeNova web portal when the Flarum extension ships.
;
; NOTE (parser contract): the plugin reads ONLY the keys below - HOST/USER/PASS/DB
; in this file were ignored by the parser (it expects MYSQL_* prefixed keys),
; which made it dial a root/empty-password connection to the local default DB
; and log "no such table: freenova_top15" on every boot. Credentials and table
; names must be set on the MYSQL_* lines for the plugin to see them.

[MYSQL]
MYSQL_HOST = 127.0.0.1
MYSQL_USER = freenova_reader
MYSQL_PASSWORD =
MYSQL_DATABASE = freenova
MYSQL_TABLE = freenova_top15
MYSQL_TABLE2 = freenova_top15
MYSQL_TABLE3 = freenova_top15

[SETTINGS]
WEBSITE_LINK = http://127.0.0.1:8080
DEFAULT_ORDER = 13
