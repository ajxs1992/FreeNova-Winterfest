// ============================================================================
// FREENova Rank System Ultimate - Core Engine Configuration
// ============================================================================

// Master toggle for the rank system (1 = Enabled, 0 = Disabled)
rsu_enabled 1

// Unique cluster Server ID for this server instance (matches `rsu_servers.id`)
rsu_server_id 1

// Database Driver Configuration:
// "auto"   - Attempts MySQL first; automatically falls back to local SQLite if unreachable.
// "sqlite" - Uses embedded local SQLite database (addons/amxmodx/data/sqlite3/freenova_rank.sq3). Zero setup needed!
// "mysql"  - Connects to external MySQL / MariaDB server (cluster mode).
rsu_sql_driver "auto"

// MySQL / MariaDB Connection Parameters
rsu_sql_host "127.0.0.1"
rsu_sql_user "root"
rsu_sql_pass ""
rsu_sql_db "FREENova_rank"

// Table prefix for multi-deployment isolation
rsu_sql_table_prefix "rsu_"

// In-Memory Dirty Flush & Autosave Interval (in seconds)
// Lower values increase DB load; higher values increase data loss risk on unexpected crash.
// Recommended: 60 for active servers.
rsu_save_interval 60

// Base Public URL for Web UI & MOTD Displays
// When a player runs /rank, /top, or /match, the plugin opens this URL with route parameters
rsu_web_url "http://127.0.0.1:8080"

// Minimum human players required on the server to award persistent XP
// Prevents players from grinding XP alone on an empty server.
rsu_min_players_for_xp 4

// Allow rank demotion when player drops below rank threshold (e.g. through death/teamkill penalties)
// 1 = Player can be demoted; 0 = Once achieved, rank tier is protected.
rsu_allow_demotion 1

// Enable verbose debug logging to AMXX logs (0 = Disabled, 1 = Enabled)
rsu_debug 0
