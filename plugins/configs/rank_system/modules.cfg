// ============================================================================
// FREENova Rank System Ultimate - Modular Sub-Plugins Registry
// ============================================================================
// Enable or disable optional system modules without uninstalling files
// ============================================================================

// Competitive Match History & End-Of-Match Scorecard
rsu_match_autoshow 1

// Bot Kill Reward Rules
rsu_botxp_enabled 1
rsu_botxp_kill 3
rsu_botxp_headshot_bonus 1
rsu_botxp_max_round 20

// Monthly Automated Season Reset
rsu_reset_enabled 1
rsu_reset_skill 0
rsu_reset_day 1

// Chat Manager Formatting Placeholders & Rank Prefixes
rsu_chat_prefixes 1
rsu_chat_show_rank 1

// Web MOTD Profile Auto-Launch on /rank
rsu_profile_motd 1
