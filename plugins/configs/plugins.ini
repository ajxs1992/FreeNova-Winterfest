; AMX Mod X plugins

; Admin Base - Always one has to be activated
admin.amxx		; admin base (required for any admin-related)
;admin_sql.amxx		; admin base - SQL version (comment admin.amxx)

; Basic
admincmd.amxx		; basic admin console commands (kick/slay/map; ban commands owned by advanced_bans)
postgres_engine.amxx	; PostgreSQL engine for Advanced Bans (binaries deployed, DB bans@172.17.0.1:5434)
fn_core.amxx		; platform base: load before fn_audit and advanced_bans
fn_mode.amxx		; mode arbiter: load before any plugin that begins a mode (simple_warmup)
fn_servers.amxx		; network browser: /servers menu over configs/fn_servers.ini (the /servers ad points here)
fn_audit.amxx		; case IDs + audit log: load before advanced_bans/fn_bans
advanced_bans.amxx	; authoritative ban backend: PG + local mirror; owns CBan natives and amx_ban/unban
cban_screenshots.amxx	; snapshots on ban via CBan_OnPlayerBannedPre
; M13-fullstack: bypass_guard.amxx omitted (incomplete chain / binary absent live)
;bg_provider_iphubclient.amxx	; IPHub lookup — no keys in iphub_api_keys.ini (RTE 1 every map)
; M13-fullstack: ab_bypass_bridge.amxx omitted (incomplete chain / binary absent live)
adminhelp.amxx		; help command for admin console commands
adminslots.amxx		; slot reservation
;fn_ban_file.amxx		; disabled: stale fork of advanced_bans - registers the same four CBan_* natives AND the same five amx_ban*/amx_unban/amx_addbanlimit commands; advanced_bans is authoritative
fn_bans.amxx		; high-level fn_* ban API and audit/case layer; delegates commands to advanced_bans
multilingual.amxx	; Multi-Lingual management

; Menus
menufront.amxx		; front-end for admin menus
cmdmenu.amxx		; command menu (speech, settings)
plmenu.amxx		; players menu (kick, ban, client cmds.)
;telemenu.amxx		; teleport menu (Fun Module required!)
mapsmenu.amxx		; maps menu (vote, changelevel)
pluginmenu.amxx		; Menus for commands/cvars organized by plugin

; Chat / Messages
fn_chat.amxx		; chat gate library (provides fn_chat_can_speak for adminchat)
adminchat.amxx		; console chat commands
antiflood.amxx		; prevent clients from chat-flooding the server
scrollmsg.amxx		; displays a scrolling message
imessage.amxx		; displays information messages
adminvote.amxx		; vote commands

; Map related
nextmap.amxx		; displays next map in mapcycle
mapchooser.amxx		; allows to vote for next map
timeleft.amxx		; displays time left on map

; Configuration
pausecfg.amxx		; allows to pause and unpause some plugins
statscfg.amxx		; allows to manage stats plugins via menu and commands


