; ============================================================================
; FreeNova mastery locker — owner editable
; File: addons/amxmodx/configs/mastery_skins.ini
;
; Leave a gun with no rows and the web mastery card stays hover-only
; (stats tooltip, no click-through locker). Add a row to open that gun page.
;
; Format (one skin per line):
;   <weapon> <mastery_level> <flag> "<display name>" <v_model> [p_model]
;
; <weapon>        : ak47 m4a1 awp deagle knife usp glock famas galil scout
;                   aug sg552 mp5 p90 ump45 mac10 tmp m249 m3 xm1014 sg550 g3sg1 he
; <mastery_level> : 1-17 from freenova_weaponstats (same thresholds as the panel)
; <flag>          : public | vip | vipplus | vipelite | admin | owner
; <v_model>       : first-person model path relative to cstrike/
; <p_model>       : optional world model ("-" = default)
;
; Flags besides public/vip/vipplus/vipelite are recorded for the owner.
; In-game application happens in weapon_models / mastery grant — the web
; never writes a model into nVault.
;
; Examples (commented — fill real .mdl paths before uncommenting):
; ak47 8 public "AK Field Camo" models/v_ak47.mdl models/p_ak47.mdl
; awp 10 vip "AWP Night Ops" models/v_awp.mdl -
; knife 5 vipelite "Karambit Fade" models/v_knife.mdl models/p_knife.mdl
; ============================================================================
