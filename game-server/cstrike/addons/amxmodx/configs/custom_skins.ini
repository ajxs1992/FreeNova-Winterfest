; ===================================================================
; FreeNova Custom Skins & Models - Exclusive Player Assignments
; ===================================================================
; Format for Weapon Skins:
;   <authid> weapon <group> <v_model> [p_model]
;
;   Where <group> is: ak47 | m4a1 | deagle | awp | knife
;   Example:
;   STEAM_0:0:12345678 weapon ak47 models/v_custom_ak.mdl models/p_custom_ak.mdl
;
; Format for Player Models:
;   <authid> player <team> <model_name>
;
;   Where <team> is: all | t | ct
;   <model_name> refers to models/player/<model_name>/<model_name>.mdl
;   Example:
;   STEAM_0:0:12345678 player ct vip_ct
;   STEAM_0:0:12345678 player t vip_tero
;   STEAM_0:0:12345678 player all vip_ct
; ===================================================================
