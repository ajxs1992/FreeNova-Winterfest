; ==============================================================================
;                SERVER NETWORK HUD & MENU CONFIGURATION
;               File Path: addons/amxmodx/configs/servers_list.ini
; ==============================================================================
;
; FORMAT:
;   "Display Name" | "IP:Port"
;   or
;   Display Name | IP:Port
;
; INSTRUCTIONS:
;   1. Each line represents one server entry.
;   2. Lines starting with ';' or '#' are comments and will be ignored.
;   3. If the port is omitted (e.g. 192.168.1.50), default port 27015 is used.
;   4. Use direct IPv4 addresses or hostnames that resolve from the players'
;      network (what players would type in console to connect).
;   5. IMPORTANT: every entry must have its REAL port. Servers sharing one IP
;      but running on different ports resolve independently - a wrong or
;      missing port makes entries show OFFLINE or marked as the wrong server.
;   6. List THIS server too (with its display name) - the plugin uses it to
;      show the configured name for the current server on the HUD/menu.
;   7. Up to 16 servers are supported in the menu (paginated automatically).
;      The top 8 servers are displayed on the HUD (customizable via cvar).
;   8. Reload this file live anytime in console with: amx_reload_servers
;
; ==============================================================================

