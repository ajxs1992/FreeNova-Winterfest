// ============================================================================
// FREENova Rank System Ultimate - XP Engine & Reward Configuration
// ============================================================================

// Base XP rewarded for eliminating an enemy
rsu_kill_xp 10

// Additional bonus XP added for a headshot elimination
rsu_headshot_bonus 5

// Additional bonus XP added for a knife elimination
rsu_knife_bonus 15

// Additional bonus XP added for a HE grenade elimination
rsu_grenade_bonus 10

// Base XP awarded for contributing damage to an assisted kill
rsu_assist_xp 4

// XP awarded for earning Most Valuable Player (MVP) in a round
rsu_mvp_xp 10

// XP awarded for successfully planting the C4 bomb
rsu_plant_xp 6

// XP awarded for successfully defusing the C4 bomb
rsu_defuse_xp 8

// XP awarded for rescuing a hostage
rsu_hostage_xp 5

// XP awarded to each surviving member of the winning team at round end
rsu_round_win_xp 5

// XP penalty deducted upon player death
rsu_death_penalty 2

// XP penalty deducted upon suicide or world hazard death
rsu_suicide_penalty 5

// XP penalty deducted upon teamkill
rsu_teamkill_penalty 15

// Enable diminishing XP yield for repeatedly killing the same victim in a single round
// 1st kill: 100% | 2nd kill: 75% | 3rd: 50% | 4th: 25% | 5th+: 0%
// Protects against coordinated spawn farming / feed exploitation.
rsu_diminishing_kills 1

// Allow XP rewards during server warmup period (0 = Disabled, 1 = Enabled)
rsu_warmup_xp 0
