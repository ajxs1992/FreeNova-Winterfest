// ============================================================================
// FREENova Rank System Ultimate - Milestones & Reward Schedules
// ============================================================================

// --- Active Playtime Milestones ---
// Rewards active non-AFK players at specified minutes played
// Format: minutes = xp_bonus
rsu_timerewards_enabled 1
rsu_timerewards_afk_check 1

// --- Happy Hour Scheduled XP Multipliers ---
rsu_hh_enabled 1
rsu_hh_start_hour 18
rsu_hh_end_hour 21
rsu_hh_multiplier 2.0
rsu_hh_weekdays_only 0

// --- Damage Accumulation Engine ---
rsu_dmgxp_enabled 1
rsu_dmgxp_threshold 100
rsu_dmgxp_amount 2

// --- Random Round Lucky Drops ---
rsu_rndxp_enabled 1
rsu_rndxp_min_players 4
rsu_rndxp_min 5
rsu_rndxp_max 25
rsu_rndxp_alive_only 1

// --- Milestone Flags ---
rsu_xpflags_enabled 1
rsu_topflags_enabled 1
rsu_topflags_interval 120.0
