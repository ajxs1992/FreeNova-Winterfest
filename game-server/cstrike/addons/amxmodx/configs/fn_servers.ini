; FreeNova community servers - the list behind /servers (fn_servers.amxx).
;
; Format per line:
;   name | address:port | short description
;
; Lines starting with ; or / are ignored. The address is format-validated
; (host:port, numeric port 1-65535) before ANY client_cmd connect, so a typo
; here means "skipped with a log line", never a bad connect command.
;
; Statuses are not live-queried yet (fn_servers M7): the menu says so rather
; than claiming a server is online. Keep descriptions short - the menu line is
; name + address + description in one GoldSrc menu row (menu_item_getinfo caps
; it at 160 chars).
;
; Keep this list in sync with the /servers ad in freenova/ads.ini: that ad is
; the reason a player types /servers in the first place.
;
