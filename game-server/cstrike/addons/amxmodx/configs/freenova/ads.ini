; FreeNova Advertisement Rotator Configuration
; File: addons/amxmodx/configs/freenova/ads.ini
; Loaded by freenova_ads.amxx at map start. Reload live from server console
; (ADMIN_RCON): fnads_reload  -  in chat: /adspreview  /adsreload
;
; Format - one ad per line:
;   <type> | <text>
;   type = chat | hud | both   (case-insensitive; the text may contain '|')
;
; Rules:
;   - Blank lines and lines starting with ';' or '#' are ignored.
;   - Chat ads: color codes work (^1 grey, ^2 green, ^3 red, ^4 team color).
;     The ^4[FreeNova]^1 tag is prepended unless fnads_tag 0.
;   - HUD ads: one color for the whole message (fnads_color).
;     Line breaks: use ^n or \n. Do NOT use ^1-^4 in HUD ads - those are
;     chat-line codes, the HUD takes its color from fnads_color.
;   - \n typed in a chat ad becomes a space (chat cannot wrap lines).
;   - Keep chat ads at ~180 characters or less; longer text is truncated by
;     the engine (the plugin logs a warning when loading such a line).
;
; Cvars (defaults):
;   fnads_enabled     1     0 pauses rotation (the timer keeps running)
;   fnads_interval    90    seconds between ads (min 10; 0 stops until reload)
;   fnads_start_delay 30    seconds after map cfg before the first ad
;   fnads_channel     2     HUD channel - 1 or 2 only (3 is freenova_hud)
;   fnads_x           -1.0  HUD x (-1.0 = centered)
;   fnads_y           0.72  HUD y - avoid 0.22 (ReGameDLL MVP text) and
;                           0.20 (imessage) / 0.18 (freenova_hud)
;   fnads_hold        7.0   HUD hold time in seconds
;   fnads_color       54 222 171   "RRR GGG BBB", Eagle teal #36DEAB
;   fnads_random      1     1 = random order, never twice the same ad in a row
;   fnads_tag         1     prepend ^4[FreeNova]^1 to chat ads
;
; House rule: every command and URL in this file must exist and work. An ad for
; a dead command is worse than no ad - players try it once and stop believing
; the rest. Verified commands: /register /forum /panel /vip /bp /missions
; /weekly /daily /rank /statsme /top15 /topcoins /shop /skins /models /guns
; /zguns /medals /ach /events /ctop /tournament /rules /commands /help /servers
; /nom /noms /rtv /extend /lg? no /profile /prefs /hud /switch /report /calladmin

; ---------------------------------------------------------------
; 1. Community + accounts (the "this is a real place" tier)
; ---------------------------------------------------------------

chat | New here? Type /register - one menu, a Steam account and a Discord role. Then say hi in discord.gg/as8kzp5KAz

chat | Prefer to look around first? /panel opens your stats, missions and BattlePass in the browser.

chat | Have an account but no forum? Type /forum for the FreeNova community info and links.

chat | Full rules: type /rules in chat - they are two screens, not ten. Reported players are handled in Discord.

chat | Something broken or someone cheating? /report <name> or /calladmin - it reaches staff in Discord, not into a void.

; ---------------------------------------------------------------
; 2. Progression (the systems we just rebuilt)
; ---------------------------------------------------------------

chat | BattlePass XP is your own track now: /bp for tiers and rewards. Level does NOT buy BattlePass tiers any more.

chat | /missions shows today's contracts - 5 daily, 4 weekly, plus bonus and VIP ones. Rewards land the moment you finish.

chat | /weekly and /daily check your contract progress without opening a menu.

chat | Rank, XP, K/D and your best weapon in one page: /rank. Lifetime standing: /top15. Richest players: /topcoins.

chat | Hard to see your progress in the middle of a fight? /hud puts rank and BattlePass on screen - /hud off hides it.

; ---------------------------------------------------------------
; 3. Economy, cosmetics, VIP
; ---------------------------------------------------------------

chat | Earn coins every round, then spend them: /shop. VIP gets a discount and skips the queue when the server is full.

chat | /vip - tiers, perks and the armory. VIP also earns BattlePass XP faster (the multiplier stacks with event boosts).

chat | Look sharp: /skins for weapon skins, /models for player models, /guns for your loadout, /medals and /ach for what you have earned.

chat | Every coin you earn is real: /topcoins ranks the wallets, /coins shows yours, and purchases are logged.

; ---------------------------------------------------------------
; 4. Events, competitions, votes
; ---------------------------------------------------------------

chat | Random events fire all map: x2 XP, AWP hours, pistol rounds. /events tells you what is running and what is next.

chat | Weekend competition: /ctop for the tournament board and /tournament for the full standings. Seasons reset weekly and monthly.

chat | Want a different map? /nom <map> to nominate, /rtv to call a vote, /extend to keep playing. The pool is all 24 classic maps.

chat | Teams stacked? Type /switch to request a swap, or /ready to skip the warm-up once enough humans are on.

; ---------------------------------------------------------------
; 5. The network (other servers - this is a community, not one box)
; ---------------------------------------------------------------

chat | We run more than one server: /servers lists the FreeNova network - Classic here, plus Zombie and Respawn.

chat | Zombie Survival is live on the same network - /servers for the address, then connect from the menu.

chat | Respawn DM is live too - fast rounds, no waiting. /servers to see every FreeNova server and its address.

; ---------------------------------------------------------------
; 6. Housekeeping / discovery
; ---------------------------------------------------------------

chat | /commands lists everything you can type, grouped by topic. /help explains the ones that need explaining.

chat | Your settings travel with you: /prefs for chat, HUD and sound, /settings for the panel side.

chat | Found a bug or have an idea? Tell us in Discord - that is where every change on this server gets decided.

chat | Everything we advertise is free to play. VIP is optional and buys conveniences, never a win.

