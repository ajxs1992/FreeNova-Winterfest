; ============================================================================
; FreeNova Winterfest - gameplay modes (workstream 7)
; File: addons/amxmodx/configs/freenova/winterfest/modes.ini
;
; Read by two plugins, each owning its own sections:
;   winterfest_snow.amxx       [modes] [snow] [grenade] [vote] [rotation]
;   winterfest_reindeer.amxx   [modes] [reindeer] [reindeer_spots]
;
; A change applies on the next map change, or immediately after
;   wf_modes_reload
; on the server console (both plugins re-read this file; an already running
; mode keeps the numbers it started with until it ends).
;
; Lines starting with ';' or '#' are comments. Two row shapes are used:
;   key = value              a number, a switch or a list
;   id | a | b | c           a table row (the header above each table says what
;                            the columns are)
; Every cap and every range is enforced while parsing, and a row that does not
; fit is skipped with a log line - a mistake in here must never take the server
; down, and it must never leave a mode half-applied either.
;
; SWITCHES vs NUMBERS: the on/off gates and the vote switch are cvars
; (wf_snow_enable, wf_reindeer_enable, wf_snow_vote, wf_rotation_enable) so an
; operator can flip them live; everything else - durations, damage, radii,
; rewards, the rotation and the spawn points - is this file. The full contract
; (inputs, every cvar, the fn_mode arbiter rules and the restore proof) is
; docs/WINTERFEST-MODES.md.
; ============================================================================


; ----------------------------------------------------------------------------
[modes]
; ----------------------------------------------------------------------------
; id | enabled | rounds | max_seconds
;
; id           the name used by `wf_mode <id>` (and by [rotation] list).
; enabled      0 = the mode refuses to start (the cvar of the same mode is a
;              second switch: both must be on).
; rounds       how many round starts the mode holds before it ends itself.
;              1 = the round it started in, then back to normal.
; max_seconds  hard ceiling, whatever the rounds say (0 = no ceiling). A mode
;              must always be able to end: rounds, this clock, an empty server,
;              the admin or fn_mode's map-end net - whichever comes first.
snow     | 1 | 3 | 900
reindeer | 1 | 2 | 600


; ----------------------------------------------------------------------------
[snow]
; ----------------------------------------------------------------------------
; The snowball itself. "10-15 damage" is the product range (docs/WINTERFEST.md
; §3): damage is the base, damage_spread is the +/- range, so 12/2 rolls 10..14.
damage        = 12
damage_spread = 2

; slow     percent of the player's own maxspeed while a snowball is on them
;          (the pre-hit speed is remembered per player and put back; see the
;          header of winterfest_snow.sma - maxspeed is not a cvar, so fn_mode
;          cannot own it).
; slow_time seconds the slow lasts.
slow      = 55
slow_time = 2.0

; cooldown  seconds between two throws, per player.
; ammo      snowballs per life (0 = unlimited). Resets on spawn.
; range     hitscan length in units. A snowball is a line, not a projectile.
cooldown = 0.8
ammo     = 8
range    = 1400

; freeze_time   how long "frozen solid" lasts: maxspeed 1, +attack blocked.
; freeze_on_kill 1 = a snowball that would take the last HP freezes instead of
;               killing, so the mode never produces a death or a frag.
; lethal        1 = a snowball CAN kill for real (then it goes through the
;               engine's damage path and normal stats/XP see it). Off by
;               default: a Christmas break should not move anyone's stats.
freeze_time    = 1.5
freeze_on_kill = 1
lethal         = 0

; friendlyfire  the mp_friendlyfire value the mode sets (through fn_mode) AND
;               whether a snowball hurts a teammate. 0 = teammates are wet
;               snow, no damage, no slow.
friendlyfire = 0

; freezetime   mp_freezetime while the mode runs (0 = a snowball round starts
;              immediately). -1 = leave the cvar alone, and then it is not
;              tracked, not changed and not restored.
freezetime = 0

; input  0 = +attack2 throws (mouse2, no bind needed, but no scope/silencer
;           inside the mode), 1 = only `bind <key> +snowball`,
;           2 = both. See docs/WINTERFEST-MODES.md "Inputs".
input = 0

; visual  what a snowball looks like. "sprite" is the only value that exists
;         today: the white TE_BEAMPOINTS trail and the impact puff. "model" is
;         reserved for the staged flashbang-model swap
;         (thirdparty/winterfest-assets/README.md: models/{p,v,w}_flashbang.mdl,
;         the classic CS trick - replace the flashbang model and a thrown
;         flashbang *is* a snowball). Client content is blocked until fastdl
;         works (docs/WINTERFEST.md §1.1), so any value other than "sprite" is
;         logged and refused at mode start and the sprites stay on.
visual = sprite


; ----------------------------------------------------------------------------
[grenade]
; ----------------------------------------------------------------------------
; The frozen grenade: an hegrenade explosion freezes everyone inside `radius`
; for `freeze_time` seconds. Only the HE grenade does this - the thrown entity
; is identified by its world model (w_hegrenade.mdl), so a flashbang hurts and
; flashes exactly like before.
enable     = 1
radius     = 250
freeze_time = 2.0


; ----------------------------------------------------------------------------
[reindeer]
; ----------------------------------------------------------------------------
; count       reindeer alive at the same time (1..8).
; respawn     seconds after one is shot before it reappears elsewhere.
; reward      snowflakes paid for one reindeer (through winterfest_core's one
;             grant path, once per reindeer instance). 0 = no reward, hunt on.
; radius      hit radius in units: a shot whose line passes this close to the
;             reindeer counts as a hit.
; range       ignore shots longer than this (units).
; glow_scale  the stock-sprite glow's scale, percent (100 = 1.0).
count      = 3
respawn    = 20
reward     = 5
radius     = 40
range      = 4000
glow_scale = 110

; visual  "sprite" is the only value that exists today (the glow marker on an
;         info_target). "model" is reserved for the staged targets
;         (thirdparty/winterfest-assets/: sneeuwman.mdl, frost_man.mdl and
;         traineau_2.mdl), and refused with a log line at mode start until
;         client downloads work (docs/WINTERFEST.md §1.1).
visual = sprite


; ----------------------------------------------------------------------------
[vote]
; ----------------------------------------------------------------------------
; /wfsnow - the public vote. The switch itself is the cvar wf_snow_vote.
; ratio  percent of the connected humans that must vote yes.
; min    votes always needed, whatever the ratio says.
ratio = 60
min   = 2


; ----------------------------------------------------------------------------
[rotation]
; ----------------------------------------------------------------------------
; One mode every `every_rounds` round starts, picked in `list` order. Only one
; mode can run at a time (fn_mode), so the rotation is a sequence, never a
; stack: each entry lasts its own [modes] rounds, ends, and normal play resumes
; until the next slot. The switch is the cvar wf_rotation_enable
; (-1 = follow `enable` here, 0 = off, 1 = on).
enable       = 0
every_rounds = 6
min_humans   = 2
; list entries: snow, reindeer
list = snow, reindeer


; ----------------------------------------------------------------------------
[reindeer_spots]
; ----------------------------------------------------------------------------
; map | x y z
;
; One row per spawn point. `*` rows are the generic set, used only when the
; current map has no rows of its own (the same rule as [presents] in
; winterfest.ini). With no row at all for a map the plugin falls back to its
; built-in set: spawn-derived points, which are always inside the playable area.
;
; NO MAP ROWS SHIP ON PURPOSE. The built-in set is measured and works on any
; map: de_dust2 gives 6 spawn-derived points (all at z = -88 in the T corner,
; printed by `wf_modes_debug 1` + `wf_modes_reload`), de_inferno 2. What that
; costs is spread - the targets sit where players spawn, not around the map.
; Add rows here for the maps your rotation actually plays; a row replaces the
; built-in set for that map entirely.
;
; A point does not have to be reachable - it has to be visible and in the open,
; because a reindeer is a non-solid marker and the server decides "was that shot
; on it" geometrically (see winterfest_reindeer.sma). Around 64 units above the
; floor reads as a target and stays out of the wall.
;
; Measured de_dust2 examples (uncomment to use them instead of the built-in set;
; these are three of the map's own info_player_start origins, +64 up):
; de_dust2 | 448 2464 -24
; de_dust2 | 352 2464 -24
; de_dust2 | 448 2112 -24

; Generic set for a map you have not looked at yet: the middle of the map's
; spawn cluster on any map. A per-map row is always better.
; * | 0 0 64
