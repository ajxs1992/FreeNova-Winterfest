; ============================================================================
; FreeNova Winterfest - the COSMETIC REGISTRY
; File: addons/amxmodx/configs/freenova/winterfest/cosmetics.ini
;
; One plugin reads this: winterfest_cosmetics.amxx. Everything Winterfest hands
; a player that is not currency lives here: hats, props, weapon models, player
; models, sounds, titles and badges. Award logic elsewhere in the module names an
; ID from this file, never a model path, so changing what December looks like is
; a config edit (docs/WINTERFEST.md sec 4 Phase 3).
;
; A row is "a | b | c". Every cap and range is checked while parsing and a row
; that does not fit is REFUSED WITH A LOG LINE - a typo here must never take the
; server down. Comments: ';' or '#'.
;
; WHY THE WEIGHT COLUMN EXISTS
; sv_allowdownload 1 lets the engine serve a precached file from the GAME PORT
; when the fastdl mirror 404s (proven on the live box). It is throttled: minutes
; for multiple MB, and every byte is paid by everyone who connects. So a
; cosmetic is ranked by what a client must download:
;   small   < 150 KB    served on connect. This is the December dressing.
;   medium  < 1 MB      only with wf_cosmetics_heavy 1, and the player is told
;                       the cost before they wear one
;   heavy   >= 1 MB     same gate; docs/WINTERFEST.md sec 1.1 says plainly that
;                       this is a loading screen a player may quit on
;
; THE SWITCHES (server.cfg / amx_cvar; the model ones need a changelevel)
;   wf_cosmetics 0|1 (default 1)          master. 0 = nothing at all.
;   wf_cosmetics_heavy 0|1 (default 0)    medium + heavy rows may be served.
;   wf_cosmetics_name 0|1 (default 1)     a worn title prefixes the scoreboard name.
;   wf_cosmetics_chat 0|1 (default 1)     borrow freenova_cosmetics' chat tag slot.
;
; TITLES AND BADGES NEED NO DOWNLOAD: they are the layer that works today, and
; they are the reward currency of Phase 1 (winterfest.ini [set] pays them through
; the core; this file decides how they are worn).
;
; HOW TO ADD A HAT (one line)
;   1. upload the .mdl (tools/deploy.sh), confirm it answers on this server
;   2. add: hat_<name> | <shown name> | hat | medium | <bytes> | <rarity> | gift | 1 | models/winterfest/<file>.mdl |
;   3. wf_cosmetics_check    <- proves the file is here and prints its real size
;   4. wf_cosmetics_reload, then changelevel
; Nothing is precached unless a row asks for it AND the file exists on this host.
; ============================================================================

; ----------------------------------------------------------------------------
; [cosmetic]
; ----------------------------------------------------------------------------
; The section header below is not decoration: the parser only takes rows that sit
; under it (a row above it is ignored, which is how this file once loaded zero
; rows). Everything from here to the end of the file is [cosmetic].
[cosmetic]
; id | name | kind | weight | bytes | rarity | source | dl | asset | text
;
; id       free-form, STABLE, and what every other module refers to. Renaming an
;          id orphans what players own (the log says so, once per file).
; name     what the player sees.
; kind     hat | skin | model | title | badge | effect | kill | death | spawn
;            hat    a model the engine hangs above the player's head
;            skin   a weapon model set (v_/w_/p_) - weapon_models.sma draws it
;            model  any other model: a prop, a player model, a sky decoration
;            effect a sprite or a sound the server triggers
;            title  pure text: worn next to the name and in chat
;            badge  pure text: a shorter mark, same display path
;            kill   an effect played at the body when YOUR victim dies
;            death  an effect left where you fell
;            spawn  a short flourish at your feet after you spawn
;          The last three are worn like a hat is, one per slot, and are played by
;          winterfest_cosmetics itself (see the effects section at the end).
; weight   small | medium | heavy  (see the header - what a client downloads)
; bytes    the size the operator EXPECTS, a sum over the asset column. The
;          preflight prints it beside the real size on this host and logs when
;          the two disagree, so a bad upload is visible instead of implied.
; rarity   0..2 on the same scale as winterfest.ini [rarity].
; source   how it is earned. Four are ASKED of winterfest_core, which stays the
;          score; only `gift` is recorded by this plugin:
;            gift      a present paid it out (wf_cosmetics_give / wfcos_grant_id)
;            advent:N  advent day N was claimed
;            pass:N    Winter Pass tier N was reached
;            tree:N    the tree reached level N
;            secret:N  ornament set N (winterfest.ini [set]) is complete
;            none      a staged asset the preflight watches; not awarded
; dl       1 = the client must download it, 0 = pure text.
; asset    client file(s) relative to cstrike/, comma-separated (max 8).
; text     the title/badge string as shown, brackets included. For a
;          `secret:N` title winterfest.ini [set] is the truth and this is only
;          the fallback for a server without winterfest_core.
;
; The 15 models in models/winterfest/ and the 12 sounds in sound/xmas/ were
; uploaded to the live host on 2026-11-22 (docs/WINTERFEST.md sec 1.1). The
; seven hat models are staged in models/sp_hats/ (owner supply). Everything else
; below that says MISSING is the Phase 3 shopping list, and wf_cosmetics_check
; names it every time an operator asks.

