; ---- effects: kill / death / spawn ---------------------------------------
; These are the kinds a player WEARS and the server PLAYS. Each one is opt-in,
; one per slot (kill, death and spawn are three independent slots), and each has
; a moment the engine already reports:
;
;   kill   what the KILLER's victim produces when they die - a burst at the body
;   death  what the DYING player leaves where they fell - an imprint or a prop
;   spawn  a short flourish at the player's feet about half a second after spawn
;
; The asset is the effect's sprite (or, for death_present, the model left
; behind). Everything named here is generated by tools/art/gen_effect_sprites.py
; out of tools/art/mksprite.py, so it is ours to ship: no third-party licence is
; involved (docs/WINTERFEST-COSMETICS.md sec 10.2).
;
; The `text` column means the kill word for a kill row: the one-word verb that
; `/wf_fx_verb` may print ("Killer shattered Victim"). It is the KILL ICON and it
; is optional - wf_fx_verb 0 turns every line off and leaves the visuals. A death
; or spawn row leaves it empty: there is no victim to name.
;
; See it before you wear it: /cospreview <id> plays it on your own body without
; dying. wf_cosmetics_fxinfo prints what the effects cost on a running server.
;
; These sprites are 8-bit indexed GoldSrc sprites: 64x64 for the bursts, 96x96
; for the two a player reads from their own feet. All six together are 215 KB,
; every row individually under the 150 KB "small" line, so they ride the connect
; download like the small props do (docs/WINTERFEST-COSMETICS.md sec 10.3).

