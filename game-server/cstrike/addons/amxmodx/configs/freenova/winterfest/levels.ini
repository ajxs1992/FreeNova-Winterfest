; ============================================================================
; FreeNova Winterfest 2026 - the per-level reward table
; File: addons/amxmodx/configs/freenova/winterfest/levels.ini
; Owner: workstream 14 (docs/WINTERFEST-WORKSTREAMS.md row 14)
; ============================================================================
; WHAT THIS FILE IS
;   The reward a player receives for REACHING a rank level, one row per level.
;   It is content: the panel (web-panel/src/winter/levels.js) renders it, and
;   nothing in the game pays anything from it in Phase 1 (see PHASE 1 below).
;
; WHAT A "LEVEL" IS HERE (read this before changing anything)
;   Level = the Rank System Ultimate ladder, i.e. the 19 rows of
;   configs/rank_system_ultimate.ini [Ranks] (Unranked .. Global Elite).
;   The game pushes that number as `players.level` (freenova_sync.sma sends
;   crxranks_get_user_level(), which rsu_crx_compat maps onto rsu_get_user_level).
;   The XP floors are the same table: src/ranks.js RANK_XP mirrors [Ranks]
;   verbatim, and the panel reads its curve from there - never from a guess.
;
;   A LEVEL IS NOT A BATTLE PASS TIER.
;   The BattlePass is a separate 60-tier track over `bp_xp`/`bp_tier`
;   (web-panel/src/bp_track.js). The recent work in this tree separated the two
;   on purpose (REVIEW.md 2.4 H1): ranking XP must never move a BP tier and a BP
;   grant must never move rank XP. This file is the RANK side only. If you are
;   looking for BP rewards they are in BattlePass.json, and `state` below is not
;   the place to describe them.
;
; ----------------------------------------------------------------------------
; FORMAT
; ----------------------------------------------------------------------------
; [level_rewards]
;   level | kind | id | amount | state | note
;
;   level   2..19 (level 1 is where every player starts; there is no row for it)
;   kind    one of the reward kinds winterfest.inc defines for the core's one
;           grant path (wf_grant):
;             gingerbread  WF_REWARD_GINGERBREAD - id ignored, amount = GingerBread
;             ornament     WF_REWARD_ORNAMENT    - id = ornament id (1..30, see
;                                                 ornaments.ini), amount ignored
;             gift         WF_REWARD_GIFT        - id = rarity (0 common,
;                                                 1 uncommon, 2 rare)
;             pass_xp      WF_REWARD_PASS_XP     - amount = Winter Pass XP
;             title        WF_REWARD_TITLE      - id = ornament-set id (1..6);
;                                                 grants that set's title
;             spin         a spin-wheel token (the core holds the counter, but no
;                          wheel spends it yet - workstream 13)
;             coins        players.coins, the year-round wallet. NOT a wf_grant
;                          kind (there is no WF_REWARD_COINS in the core)
;   id      reward id as defined by the kind (0 when the kind has none)
;   amount  reward amount as defined by the kind (0 when the kind has none)
;   state   live    - the game can pay this today through wf_grant
;           coming  - the feature it needs is not in this build
;           The panel independently enforces this: a kind whose feature it knows
;           is missing is shown as "coming" even if this column says live
;           (web-panel/src/winter/levels.js REWARD_KINDS, test_harness.mjs).
;   note    one short sentence, shown on the panel next to the reward
;
; Blank lines and lines starting with ';' or '#' are ignored. Field order is
; fixed; extra fields are ignored by the reader, missing trailing fields are
; read as 0/"".
;
; ----------------------------------------------------------------------------
; PHASE 1: NOTHING HERE IS CLAIMABLE
; ----------------------------------------------------------------------------
; Phase 1 has no claim ledger for level rewards, so the panel is informational
; and says so on the page. A row here is a promise shown to the player as
; "at level N you get X", not a payout. Do not add a claim button to the panel
; until the game can pay it through wf_grant with a claim key of the shape
; `level#<level>` - the same anti-dupe rule every other reward in the module
; follows (docs/WINTERFEST-DEV.md section 3).
;
; ----------------------------------------------------------------------------
; KEEP IN LOCKSTEP WITH web-panel/src/winter/levels.js
; ----------------------------------------------------------------------------
; The Worker has no filesystem, so the panel carries these rows as data
; (LEVEL_REWARDS) exactly the way src/ranks.js carries [Ranks] and
; bp_track.js carries the BP payout table. test_harness.mjs parses THIS file
; and fails when the two disagree, so "keep in lockstep" is enforced, not
; remembered.
; ============================================================================

[level_rewards]
