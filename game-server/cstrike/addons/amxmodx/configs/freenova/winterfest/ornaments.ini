; ============================================================================
; FreeNova Winterfest 2026 - ornament catalogue and the secret collections
; File: addons/amxmodx/configs/freenova/winterfest/ornaments.ini
; ============================================================================
; 30 ornaments in 6 named sets. Every set is a "secret collection": collect all
; five of its ornaments and the set pays out (owner brief; WINTERFEST.md section
; 3, "Ornament collection + secret sets").
;
; This file is the [ornament] and [set] sections of
; configs/freenova/winterfest.ini - the ONE file winterfest_core.amxx opens.
; Merge these rows there under the matching headers; see
; docs/WINTERFEST-CONTENT.md for the merge and for why the sections are split
; here.
;
; ----------------------------------------------------------------------------
; [ornament]  id | name | rarity | set | hidden
; ----------------------------------------------------------------------------
;   id     1..64 (WF_MAX_ORNAMENTS). The id is what [advent], [pass] and the
;          [open] reward pool name; renumbering it retroactively changes what
;          an already-granted reward was. Add at the end, never reorder.
;   name   shown in /ornaments, /tree and the panel tree. 31 chars max
;          (g_szOrnName[32]).
;   rarity 0 = common, 1 = uncommon, 2 = rare. The names, chat colours and
;          gift-roll weights live in winterfest.ini's [rarity] rows; this column
;          only classifies the ornament.
;   set    1..8 (WF_MAX_SETS); 0 = belongs to no set and counts for nothing.
;          A set is complete when every ornament with that set number is owned.
;   hidden 1 = the panel and /ornaments show "? ? ?" until the player owns it,
;          0 = always visible. THIS COLUMN IS NOT READ BY winterfest_core.amxx
;          TODAY: parseOrnament() reads fields 0..3 and ignores the fifth. It is
;          an additive, forward-compatible column for the menu/panel readers,
;          so a hidden ornament never leaks its name before it is collected.
;          Every set keeps its two rarest pieces hidden - that is what makes a
;          collection feel like it was found rather than listed.
;
; ----------------------------------------------------------------------------
; [set]  id | name | title | snow
; ----------------------------------------------------------------------------
;   id    1..8. The id (not the name) is the reward id of a "title" reward, so
;         [advent] day 24 can grant a set's title with "title | 6 | 0".
;   name  the collection's name in the panel: "Snowflakes 3/5".
;   title the badge text granted when the set completes, and what the player
;         wears after /christmas -> titles. 39 chars max.
;         Set 2 and 3 name a MODEL in the brief (Santa's Helper, Grinch). Until
;         fastdl works (WINTERFEST.md section 1.1) the engine can only grant a
;         title, so the title carries the name and the model ships in Phase 3,
;         keyed off the same set id - no config change needed then.
;   snow  snowflakes paid ONCE when the set completes, alongside the title
;         (WfSyncSets uses claim keys "set#<id>" and "setbx#<id>", so a late
;         ornament or a reconnect cannot pay twice).
;
; ----------------------------------------------------------------------------
; THE SECRET COLLECTIONS
; ----------------------------------------------------------------------------
;   set 1  Snowflakes            5/5 -> title "Ice Warrior"
;   set 2  Santas                5/5 -> title "Santa's Helper" (model in Phase 3)
;   set 3  Grinches              5/5 -> title "Grinch"         (model in Phase 3)
;   set 4  Sleighs               5/5 -> title "Sleigh Bells"   (animated title)
;   set 5  Bells & Candy Canes   5/5 -> title "Candy Cane Kid"
;   set 6  Special               5/5 -> title "Winterfest Legend"
;   all six complete              -> the Winterfest Legend weapon pack.
;         The pack is not a per-set title: the core grants one title per set,
;         so "all six complete" is computed from set ownership by the panel /
;         the coordinator's module. Set 6's title deliberately shares the name
;         because the badge is what the engine can grant today.
;
; Catalogue shape: 10 common, 12 uncommon, 8 rare; 12 of the 30 hidden.
; Every map's presents, every Advent day and every pass tier draw from these
; ids, and no id is used by two sets. tools/winterfest tests check the
; arithmetic (5 per set, hidden flags 0/1, rarity in range).
; ============================================================================

