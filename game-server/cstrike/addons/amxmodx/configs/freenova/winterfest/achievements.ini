; ============================================================================
; FreeNova Winterfest - seasonal achievements
; File: addons/amxmodx/configs/freenova/winterfest/achievements.ini
;
; Loaded by winterfest_progress.amxx at map start, only when the season window in
; progress.ini is open. A change applies on the next map change.
;
; An achievement is a PERMANENT badge, not a per-season counter. The unlock is
; written to its own unseasoned nvault key (wfprog_badge#<steamid>), so a badge
; earned in December 2026 is still shown in December 2027 - that is what makes it
; a badge. The REWARD is paid once per season through the core's claim ledger
; (claim key wfprog_a#<season>#<id>#<steamid>), so a re-run next year pays the
; new season's reward once and the old claim stays spent.
;
; The four badges the brief names are here:
;   ach_legendary_find    opened a legendary present
;   ach_secret_collection completed a secret collection (a core set)
;   ach_advent_24         24 of 24 Advent days
;   ach_tree_5            tree level 5
;
; ----------------------------------------------------------------------------
; FORMAT
; ----------------------------------------------------------------------------
;   [achievement]
;   id | name | check | target | xp | coins | badge | season
;
;   id      label used in log lines, the vault value and the panel bridge.
;   name    shown in /christmasmissions (achievements page) and in the chat line.
;   check   what is measured. Same vocabulary as missions.ini, minus map_rounds
;           (an achievement has no map column, so a map-specific check would be
;           dead by construction - such a row is refused at load):
;             kills headshots streak rounds wins
;             presents opens legendary advent sets tree pass_tier snowball_hs
;           kills/headshots/streak/rounds/wins read a season-long total that this
;           plugin keeps itself; presents/opens/legendary come from the present
;           inventory; advent/sets/tree/pass_tier are read from winterfest_core.
;   target  the value that unlocks it. Must be > 0.
;   xp      Winter Pass XP paid on unlock (once per season).
;   coins   season currency paid on unlock (once per season). GingerBread, id
;           `gb` - see docs/WINTERFEST-DEV.md; "snowflakes" is the legacy name
;           for the same reward kind. The player-facing name comes from
;           winterfest.inc (WF_CURRENCY_NAME), never from this file.
;   badge   the permanent badge label. Maximum 23 characters; it is what the
;           player is called after the unlock and what the panel will render.
;   season  season tag; a row for another season is skipped (staged rows).
;
; A row that fails validation is skipped with
;   [WF-PROG] achievements.ini: line N: <reason>
; and the rest of the file still loads.
;
; Nothing here can be unlocked twice: the badge list is checked first (owned =
; done), the core's claim key is the second gate (a crash between the payout and
; the badge write unlocks again, pays zero, and writes the badge), and the award
; itself is the core's WF_REWARD_SNOWFLAKES / WF_REWARD_PASS_XP path only.
; ============================================================================


[settings]
season = 2026


[achievement]
;      id                    | name                  | check      | target | xp  | coins | badge                 | season
ach_first_present           | First Snow            | presents   | 1      | 40  | 50    | First Snow            | 2026
ach_ten_presents            | Gift Gatherer         | presents   | 10     | 150 | 200   | Gift Gatherer         | 2026
ach_first_open              | Wrapper Ripper        | opens      | 1      | 40  | 50    | Wrapper Ripper        | 2026
ach_ten_opens               | Unwrapping Pro        | opens      | 10     | 150 | 200   | Unwrapping Pro        | 2026
ach_legendary_find          | Legendary Find        | legendary  | 1      | 400 | 500   | Legendary Find        | 2026
ach_secret_collection       | Secret Collector      | sets       | 1      | 400 | 500   | Secret Collector      | 2026
ach_advent_1                | Advent Starter        | advent     | 1      | 80  | 100   | Advent Starter        | 2026
ach_advent_24               | Advent Faithful       | advent     | 24     | 800 | 1000  | Advent Faithful       | 2026
ach_tree_5                  | Tree Whisperer        | tree       | 5      | 400 | 500   | Tree Whisperer        | 2026
ach_streak_8                | Blizzard Streak       | streak     | 8      | 250 | 300   | Blizzard Streak       | 2026
ach_rounds_50               | Season Regular        | rounds     | 50     | 250 | 300   | Season Regular        | 2026
ach_pass_10                 | Pass Rider            | pass_tier  | 10     | 300 | 400   | Pass Rider            | 2026
