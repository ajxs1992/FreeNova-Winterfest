; ============================================================================
; configs/freenova/winterfest/killfeed.ini
; ============================================================================
; Owner: workstream 6 (atmosphere & effects). Read by winterfest_killfeed.amxx.
; Documentation: docs/WINTERFEST-ATMOS.md.
;
; This is Winterfest's wording table, and it is NOT configs/freenova/winterfest.ini
; (workstream 1 owns that file). Nothing here is a number: every numeric knob -
; the language, the "Santa's chosen" chance, the toggle - is a cvar.
;
; ---------------------------------------------------------------------------
; [lines] format
; ---------------------------------------------------------------------------
;     id | english | french | german
;
; One row per line id, one table keyed by id. The three text columns are the
; languages: English is the product language and is REQUIRED on every row. The
; French and German columns ship empty on purpose - the audience is EU, but a
; machine translation of festive copy reads worse than English - and an empty
; column falls back to English, so a row can be translated alone, later, without
; touching code or shipping a blank announcement.
;
;   wf_kf_lang en | fr | de        which column to use (default en)
;
; Tokens, substituted straight into the text (never a printf format, so a %
; character in a line or in a player name is harmless):
;
;     {player}   the killer's name
;     {victim}   the victim's name
;     {n}        the streak length
;
; Rules of the file:
;   * a row whose id is not in the list below is logged and ignored;
;   * a row without English text is logged and ignored (the built-in English
;     line stays in place);
;   * '|' is the field separator, so a line may not contain one;
;   * a text longer than 191 characters is truncated on load.
;
; Ids: streak3, streak5, streak7, streak10, streak15, headshot, santa.
; ============================================================================

[lines]

; --- killstreaks: 3, 5, 7, 10 and 15 kills in one round ---------------------
streak3    | {player} is on a hattrick - ho ho ho! | |
streak5    | {player} has five in a row and a stocking full of grenades. | |
streak7    | {player} is on Santa's nice list - {n} straight. | |
streak10   | {player} is a one-elf army - {n} kills without dying. | |
streak15   | {player} IS Santa's chosen - {n} kills in a row! | |

; --- every headshot ---------------------------------------------------------
headshot   | Ho ho ho! {player} hung that one on the mantel. | |

; --- the rare line (wf_kf_santa percent chance, on any kill) ----------------
santa      | Santa's chosen: {player} is handing out early presents. | |
