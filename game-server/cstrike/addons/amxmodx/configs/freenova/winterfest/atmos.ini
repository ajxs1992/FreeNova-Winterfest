; ============================================================================
; configs/freenova/winterfest/atmos.ini
; ============================================================================
; Owner: workstream 6 (atmosphere & effects). Read by winterfest_atmos.amxx and
; winterfest_killfeed.amxx (both include winterfest_atmos.inc, so both agree on
; whether the season is open). Full documentation: docs/WINTERFEST-ATMOS.md.
;
; This file holds ONE thing: the date window. Everything numeric - snow rate,
; radius, height, life, storm length, tint - is a cvar, because an operator
; changes those live and they belong next to the other server settings.
;
; ---------------------------------------------------------------------------
; [season] start / end
; ---------------------------------------------------------------------------
; Two dates. Each may be written either way:
;
;     start = 12-01            recurring: the 1st of December, every year
;     end   = 12-31
;
;     start = 2026-12-01       pinned: only that year (both entries pinned)
;     end   = 2026-12-31
;
; start later in the year than end wraps the new year, so 12-20 .. 01-06 is a
; single window across two calendar years.
;
; If this file is missing, unreadable, or is missing either date, the modules
; fall back to the built-in window 12-01..12-31 (every year) and say so in
; addons/amxmodx/logs/. December is never dark because of a typo here.
;
; The window is evaluated when a map loads and when an admin runs
; `wf_atmos_apply` / `wf_killfeed_apply`. A server left running across midnight
; on 1 December picks the season up at the next map change - that is deliberate:
; a timer that re-checks would mean the off-season state is not actually idle,
; and "zero timers outside the window" is a requirement.
;
; To see the mood in November (a rehearsal, a screenshot, a stream), do NOT
; edit this file - set `wf_atmos_force 1` and run `wf_atmos_apply`.
; ============================================================================

[season]
start = 12-01
end   = 12-31
