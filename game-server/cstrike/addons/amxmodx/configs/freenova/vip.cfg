; FreeNova VIP - central configuration
; Loaded by freenova_vip.amxx on plugin_cfg.
; Tiers: 1 = VIP, 2 = VIP+, 3 = VIP ELITE (higher tiers include lower ones).

fnvip_enabled 1

; XP multipliers applied through the single BattlePass multiplier chain
fnvip_mult_xp_1 1.10
fnvip_mult_xp_2 1.20
fnvip_mult_xp_3 1.30

; BattlePass XP multipliers (progression layer reads these via fnvip)
fnvip_mult_bp_1 1.05
fnvip_mult_bp_2 1.10
fnvip_mult_bp_3 1.15

; Coin reward multipliers
fnvip_mult_coin_1 1.05
fnvip_mult_coin_2 1.10
fnvip_mult_coin_3 1.15

; Registration promotion (unregistered players only, never spams:
; one broadcast per interval, skipped for registered/trial-claimed players)
fnvip_ad_enabled 1
fnvip_ad_interval 180

; Set 1 only while debugging entitlement resolution
fnvip_debug 0
