; ============================================================================
; FreeNova Events - scheduled windows, flavour pool and per-map scaling
; File: addons/amxmodx/configs/freenova/events.ini
; Loaded by freenova_randevent.amxx at map start; a change applies on the next
; map change. Missing or unreadable -> the plugin keeps its 1.1.0 behaviour
; (dice only, built-in flavour pool), so this file is optional.
;
; ----------------------------------------------------------------------------
; MODES
; ----------------------------------------------------------------------------
;   mode = random     only the dice driver runs: every fn_re_min..fn_re_max
;                     minutes pick one available flavour and hold it for
;                     fn_re_duration minutes. THIS IS THE DEFAULT and is what
;                     the server did before this file existed.
;   mode = schedule    only the [window] rows run. The dice driver is off.
;   mode = both       windows run, and when no window is open the dice driver
;                     fills the gaps.
;
; The windows below are configured but INACTIVE while mode = random. Change
; mode to schedule or both to turn them on.
;
; ----------------------------------------------------------------------------
; FLAVOUR POOL
; ----------------------------------------------------------------------------
;   name | weight | min | max
;
; The four names are fixed - they are the four channels the server has:
;   xp      -> fn_event_xp_mult    (freenova_sync)
;   coins   -> fn_event_coins_mult (freenova_sync)
;   double  -> fn_double_xp        (freenova_panel, a 0/1 flag)
;   happy   -> fn_happy_hour       (freenova_progression)
;
; weight is the relative chance in the dice driver and for a window whose
; flavour is "-". 0 disables the flavour everywhere (a single-flavour server
; sets the others to 0). min/max are the magnitude range rolled in 0.1 steps;
; for double and happy set min = max. Magnitudes are clamped to 1.0..5.0, the
; range freenova_sync's event multiplier accepts.
;
; ----------------------------------------------------------------------------
; WINDOWS
; ----------------------------------------------------------------------------
;   id | days | start | end | flavor | multiplier
;
;   id          label used in log lines and in the vault record.
;   days        comma list of weekdays, or weekday/weekend:
;               sun,mon,tue,wed,thu,fri,sat  (numbers 0-6 also work, 0 = Sunday)
;   start, end  local server clock, HH:MM. A window must end after it starts
;               on the same day; a window cannot cross midnight (split it into
;               two rows instead).
;   flavor      one of the four names, or "-" to roll from the pool.
;   multiplier  fixed magnitude, or empty/0 to roll min..max from the pool.
;
; A window is opened by a 30 s ticker once its start time is reached, and is
; closed at its end time. If the map changes (or the server restarts) while a
; window is open, the next map re-opens it for the time that is left - with the
; value that was there BEFORE the window, never by multiplying the multiplier
; again. A window that was already handled today is not re-opened.
;
; A window never opens while another event owns the channel: if the panel (or a
; window, or freenova_progression's happy hour) already boosted something, this
; plugin logs the skip and retries on the next tick. It also never overrides a
; channel that someone else changed while the window was running.
;
; ----------------------------------------------------------------------------
; PER-MAP MULTIPLIER
; ----------------------------------------------------------------------------
;   map | multiplier
;
; Scales the magnitude of every event opened on that map (dice and windows),
; after the flavour/window value and before the 1.0..5.0 clamp. double is a 0/1
; flag and is never scaled. Missing map = 1.0.
;
; ----------------------------------------------------------------------------
; SIMULTANEOUS EVENTS
; ----------------------------------------------------------------------------
; Only one channel is boosted at a time by this plugin. freenova_sync multiplies
; xp and coin events into earnings, so boosting two at once would multiply the
; multipliers - the skip-when-active check exists to prevent exactly that.
; ============================================================================

[settings]
; random | schedule | both  (see MODES above)
mode = random

[flavor]
;      name   | weight | min | max      (these are the 1.1.0 built-in values)
xp     | 25 | 1.5 | 3.0
coins  | 25 | 1.5 | 3.0
double | 25 | 1.0 | 1.0
happy  | 25 | 2.0 | 2.0

[window]
;      id            | days      | start | end   | flavor | multiplier
midweek_xp           | wed       | 20:00 | 22:00 | xp     | 2.0
friday_double        | fri       | 20:00 | 23:00 | double |
weekend_coins        | sat,sun   | 14:00 | 18:00 | coins  | 1.5

[map]
;      map        | multiplier
; de_dust2           | 1.25
; cs_office          | 1.10
