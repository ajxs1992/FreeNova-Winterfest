; ============================================================================
; FREENova Rank System Ultimate - Main Configuration File
; Fully Compliant with Tornado AMXX Hub Rank System Ultimate Documentation
; ============================================================================

[Settings]
; Database driver selection ('sqlite' or 'mysql').
; SQLite creates local DB in amxmodx/data/sqlite3/RanksUltimate.sq3.
; MySQL uses settings from amxmodx/configs/sql.cfg or core settings.
SQL_DRIVER = sqlite

; Default language for MOTD screens (e.g., en, de, es, bg, ro, ru, etc.).
; Leave empty to use player's amx_langmenu setting.
MOTD_LANGUAGE = 

; MOTD URLs are built by freenova_web.inc (short /m/<page>/<steam>.htm).
; This key is unused for show_motd; kept for diagnostics.
MOTD_BASE_URL = http://192.168.1.3:8080

; Player data saving method (0 = save by name | 1 = save by IP | 2 = save by SteamID)
SAVE_TYPE = 2

; When to save player data (0 = save on round end | 1 = save on map end | X = save every X minutes)
SAVE_INTERVAL = 0

; Chat prefix for all system messages ($1 = normal color | $3 = team color | $4 = green color)
CHAT_PREFIX = $3[$4Rank System Ultimate$3]$1

; Shows information about player's rank on each spawn (0 = off | 1 = on)
RANK_INFO = 1

; Enable/disable bots ranking (0 = disabled | 1 = enabled | 2 = disable bot ranking but keep real players from receiving statistics from them)
RANK_BOTS = 0

; For how long a player is considered new (in seconds)
TIME_NEW = 7200

; How to order top players by default.
; First value: stats order (0=XP, 1=Nick, 2=Kills, 3=Assists, 4=Deaths, 5=Skill, 6=HS%, 7=Bombs Planted, 8=Bombs Exploded, 9=Bombs Defused, 10=Rounds Won, 11=MVP, 12=Rank, 13=Overall, 14=Weapon).
; Second value: default weapon order (0=Knife, 1=Glock18, 2=USP, etc.)
DEFAULT_ORDER = 13 0

; If first value > 0, players will not receive certain statistics unless there are at least X players connected.
; Statistics separated by '|': all, level, kills, assists, deaths, headshots, planted, defused, exploded, roundswon, mvp, shots, hits, damage
MINIMUM_PLAYERS = 0 level

; Which team should receive XP (blank/0 = All Teams | 1 = Terrorists Only | 2 = CT Only | 3 = Spectators Only)
TEAM_SET = 

; Whether or not to show the Map End MOTD screen (0 = Hide | 1 = Show)
SHOW_MAPEND_MOTD = 1

; Message type when a player levels up/down (0 = turn off | 1 = only he can see it | 2 = all players can see it)
LEVEL_MESSAGE_TYPE = 2

; Level up screen effects: Red, Green, Blue, Alpha, Hold time (-1 for random color, Alpha 0 to disable)
LEVELUP_EFFECTS = 0 255 0 75 1.0

; Level up sound (leave blank for no sound)
LEVELUP_SOUND = warcraft3/levelupcaster.wav

; Level down screen effects: Red, Green, Blue, Alpha, Hold time
LEVELDN_EFFECTS = 255 0 0 75 1.0

; Level down sound (leave blank for no sound)
LEVELDN_SOUND = warcraft3/purgetarget1.wav

; Assists: min damage is still read. Money and frag are ignored.
; freenova_teamxp pays the assist XP. Do not put money back here.
ASSIST_VALUES = 40 0 0

; Enable/disable player rank HUD status (0 = off | 1 = on)
; 0: the FreeNova white/silver HUD (freenova_hud.amxx) owns the under-radar
; HUD; the core's fallback HUD would overlap it. XP + MVP HUDs stay on.
HUD_ENABLE = 0

; HUD rank status type (0 = HUD | 1 = DHUD)
HUD_TYPE = 0

; HUD rank status information format
HUD_INFO = Name: %name% %newline%Level: %level% / %max_levels% %newline%XP: %xp% / %next_xp% (%xp_percent%%%) %newline%Rank: %rank% %newline%Server Rank: %server_rank% / %max_server_ranks% %newline%Skill: [%skill% %skill_range%]

; HUD info when player reached maximum level
HUD_INFO_MAX = Name: %name% %newline%Level: %level% %newline%XP: %xp% %newline%Rank: %rank% %newline%Server Rank: %server_rank% / %max_server_ranks% %newline%Skill: [%skill% %skill_range%]

; HUD message values (Red, Green, Blue, Position X, Position Y)
; HUD rendering is owned by freenova_hud (white/silver under-radar HUD);
; the core's own HUD stays as a fallback when the hud plugin is absent.
HUD_VALUES = 0 255 -1 0.01 0.17

; Enable/disable HUD message when you get/lose XP (0 = off | 1 = on)
XP_HUD_ENABLE = 1

; Enable/disable HUD message when your team gets/loses XP (0 = off | 1 = on)
XP_HUD_TEAM_ENABLE = 1

; HUD type if XP_HUD_ENABLE is 1 (0 = HUD | 1 = DHUD)
XP_HUD_TYPE = 1

; HUD type for team XP messages (0 = HUD | 1 = DHUD)
XP_HUD_TEAM_TYPE = 1

; HUD message when getting XP
XP_HUD_GET = +%xp% XP

; HUD message when team gets XP
XP_HUD_TEAM_GET = +%xp% Team XP

; HUD message when losing XP
XP_HUD_LOSE = -%xp% XP

; HUD message when team loses XP
XP_HUD_TEAM_LOSE = -%xp% Team XP

; HUD values: Red, Green, Blue, X, Y, Effect (0=none, 1=blink, 2=typewriter), Hold time
XP_HUD_VALUES = 0 255 150 0.65 0.70 0 1.0

; Team XP HUD values: Red, Green, Blue, X, Y, Effect, Hold time
XP_HUD_TEAM_VALUES = 0 255 150 0.65 0.75 0 1.0

; Enable/disable HUD message for end-round MVP (0 = off | 1 = on)
MVP_HUD_ENABLE = 1

; HUD type if MVP_HUD_ENABLE is 1 (0 = HUD | 1 = DHUD)
MVP_HUD_TYPE = 0

; MVP HUD values (Red, Green, Blue, Position X, Position Y)
; y=0.22 — keep off the rank HUD line (fn_hud_y default 0.18 under the radar)
MVP_HUD_VALUES = 150 150 150 -1.0 0.22

; Web MOTD Base URL — LAN HTTP panel (GoldSrc cannot fetch 127.0.0.1 from the client)
MOTD_BASE_URL = http://192.168.1.3:8080

[Commands]
; Commands for opening RankStats MOTD
STATS_COMMANDS = say /statsme, say_team /statsme, say /rankstats, say_team /rankstats

; Commands for opening Stats Viewer menu
STATSVIEWER_COMMANDS = say /statsviewer, say_team /statsviewer

; Commands for showing player XP information in chat
XP_COMMANDS = say /xp, say_team /xp, say /level, say_team /level

; Commands for showing player rank information in chat
RANK_COMMANDS = say /rank, say_team /rank, say /skill, say_team /skill

; Commands for toggling player HUD rank status
HUDINFO_COMMANDS = say /hudinfo, say_team /hudinfo

; Commands for toggling rank info message on spawn
RANKINFO_COMMANDS = say /rankinfo, say_team /rankinfo

; Commands for Top15 MOTD (rsu_core owns these; rsu_top no longer registers /top or /top15)
TOP15_COMMANDS = say /top, say_team /top, say /top15, say_team /top15

[XP Rewards]
; Usage: keyword = <Player XP> <Team XP (optional)>
kill = 2 0
headshot = 1 0
; assist = 0: assist XP is owned by freenova_teamxp (best-damager model);
; the RSU engine still COUNTS assists for stats, it just does not pay XP.
assist = 0 0
blind = 1 0
knife = 3 0
grenade = 4 0
; bomb team shares = 0: objective team XP is owned by freenova_teamxp;
; the RSU engine still counts plants/defuses/explosions and pays the personal part.
bomb_plant = 5 0
bomb_defuse = 10 0
bomb_explode = 5 0
team_kill = -4 0
suicide = -7 0
vip = 1 0
vip_flags = r
; Round-win XP is paid by freenova_teamxp (SendAudio hook).
t_win = 0 0
ct_win = 0 0
t_lose = 0 0
ct_lose = 0 0
mvp = 3 0
hostage_rescued = 5 0
hostage_killed = -5 0

