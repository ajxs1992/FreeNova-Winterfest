Unranked = 0
Silver I = 2816
Silver II = 3730
Silver III = 4207
Silver IV = 4698
Silver Elite = 4999
Silver Elite Master = 5622
Gold Nova I = 6492
Gold Nova II = 7416
Gold Nova III = 8376
Gold Nova Master = 9348
Master Guardian = 9999
Master Guardian II = 10894
Master Guardian Elite = 12013
Distinguished Master Guardian = 13088
Legendary Eagle = 14187
Legendary Eagle Master = 15495
Supreme Master First Class = 18006
Global Elite = 30000

[Skills]
; Skill tier thresholds based on ELO / Skill Ratio: 100.0 * Kills / (Kills + Deaths)
; The skill marked with '*' is the default starting skill for new players.
L- = 0.00
L = 60.00
L+ = 75.00
M- = 85.00
M = 100.00 *
M+ = 115.00
H- = 130.00
H = 140.00
H+ = 150.00
P- = 165.00
P = 180.00
P+ = 195.00
G = 210.00