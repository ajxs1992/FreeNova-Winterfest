; ============================================================================
; CSWOS Competitive Platform — Engagement & Event Rules Configuration
; File: events.ini
; Consolidates Happy Hour, Playtime Rewards, Random Round XP, Damage & Bot Rules
; ============================================================================

[HappyHour]
; Enable Happy Hour time-window multiplier
ENABLED = 1
; Start hour (24-hour format, 0 to 23)
START_HOUR = 18
; End hour (24-hour format, 0 to 23)
END_HOUR = 21
; Multiplier factor (2.0 = Double XP)
MULTIPLIER = 2.0
; 1 = Monday-Friday only, 0 = All 7 days
WEEKDAYS_ONLY = 0

[PlaytimeRewards]
; Enable active playtime milestone rewards
ENABLED = 1
; Enable AFK detection (stops timer if player doesn't move or turn)
AFK_CHECK = 1
; Inactivity seconds before player is considered AFK
AFK_TIMEOUT = 45
; Milestones format: MINUTES XP_BONUS COIN_BONUS
MILESTONE_1 = 15 30 5
MILESTONE_2 = 30 75 15
MILESTONE_3 = 60 180 35
MILESTONE_4 = 120 400 80
MILESTONE_5 = 240 1000 200

[RandomRoundXP]
; Enable random round lottery reward at round end
ENABLED = 1
; Minimum human players required for lottery to fire
MIN_PLAYERS = 4
; Min and Max random XP awarded to winner
MIN_XP = 5
MAX_XP = 25
; 1 = Only living players can win, 0 = Any team member
ALIVE_ONLY = 1

[DamageXP]
; Enable XP for cumulative damage dealt to enemies
ENABLED = 1
; Damage threshold required to trigger XP
DAMAGE_THRESHOLD = 100
; XP awarded per damage threshold reached
XP_AMOUNT = 2

[BotKillRewards]
; Enable scaled XP for frags against bot opponents
ENABLED = 1
; Base XP per bot kill
BOT_KILL_XP = 3
; Additional bonus XP for headshot bot kill
BOT_HS_BONUS = 1
; Maximum bot XP allowed per round (prevents round bot farming)
MAX_BOT_XP_PER_ROUND = 20
